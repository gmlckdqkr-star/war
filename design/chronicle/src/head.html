<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>잿빛 연대기 — 쌍둥이탑 성</title>
<style>
/*FONTFACE*/
:root { --ink:#1E1916; --ink2:#3A322B; --paper:#E8DFCB; --paperHi:#F5EFE1; --cin:#B3271D; --gold:#C8962D; --indigo:#2B4A78; }
html, body { margin:0; height:100%; background:#1E1916; overflow:hidden; -webkit-font-smoothing:antialiased; }
#stage { position:relative; width:100vw; height:100vh; }
canvas#c { position:absolute; left:0; top:0; display:block; }
#hud { position:absolute; inset:0; pointer-events:none; font-family:'Gowun Batang', 'Noto Serif KR', 'Nanum Myeongjo', serif; color:var(--ink); letter-spacing:-0.01em; }
#hud .slip { position:absolute; top:0; height:29px; display:flex; align-items:center; gap:5px; padding:0 11px 3px; background-color:#E8DFCB; background-image:var(--paperimg); background-size:256px 128px; box-shadow:0 1px 0 rgba(30,25,22,.35); }
#hud .top-l { left:0; padding-left:12px; }
#hud .top-r { right:0; padding-right:12px; }
#hud .book { font-size:10.5px; color:var(--cin); font-weight:700; letter-spacing:.04em; margin-right:2px; }
#hud .castle { font-size:15px; font-weight:700; letter-spacing:-.02em; }
#hud .lbl { font-size:11px; color:var(--ink2); }
#hud .wave { font-size:12px; font-weight:700; color:var(--cin); }
#hud .sep { width:1px; height:15px; background:rgba(30,25,22,.35); margin:0 4px; }
#hud #keepTxt { font-size:13px; }
#hud .kbar canvas { width:64px; height:10px; display:block; }
#hud .chron { position:absolute; top:33px; left:50%; transform:translateX(-50%); max-width:470px; padding:3px 11px 4px 20px; font-size:11px; line-height:1.35; color:var(--ink2); background:rgba(245,239,225,.9); border-bottom:1.5px solid var(--ink); opacity:0; transition:opacity .4s; white-space:nowrap; }
#hud .chron.on { opacity:1; }
#hud .chron .rub { position:absolute; left:7px; top:6px; width:7px; height:9px; background:var(--cin); transform:skewX(-8deg); }
#hud .chron .by { margin-left:9px; font-size:10px; color:var(--cin); }
#hud .bark { position:absolute; max-width:196px; padding:2px 8px 3px; font-size:10.5px; line-height:1.3; background:var(--paperHi); border:1.4px solid var(--ink); border-radius:1px 6px 2px 5px; box-shadow:2px 2px 0 rgba(30,25,22,.25); }
#hud .bark b { display:block; font-size:9.5px; color:var(--cin); letter-spacing:.02em; }
#hud .bark::after { content:''; position:absolute; left:12px; bottom:-7px; width:9px; height:7px; background:var(--ink); clip-path:polygon(0 0,100% 0,15% 100%); }
#hud .cards { position:absolute; right:76px; bottom:8px; display:flex; gap:6px; }
#hud .card { position:relative; width:152px; height:46px; }
#hud .card.sel { transform:translateY(-3px); }
#hud .card .cbg { position:absolute; inset:0; }
#hud .card .em { position:absolute; left:5px; top:7px; }
#hud .card .nm { position:absolute; left:38px; top:6px; right:6px; font-size:11.5px; font-weight:700; letter-spacing:-.04em; white-space:nowrap; overflow:hidden; }
#hud .card .ct { position:absolute; left:38px; top:21px; font-size:14px; font-weight:700; line-height:18px; }
#hud .card .ct i { font-style:normal; font-size:10px; color:var(--ink2); font-weight:400; }
#hud .card .st { position:absolute; right:9px; top:24px; font-size:10.5px; color:var(--ink2); }
#hud .card .st.red { color:var(--cin); font-weight:700; }
#hud .card .st.warn { color:var(--gold); font-weight:700; }
#hud .card .mb { position:absolute; left:72px; top:29px; }
#hud .abil { position:absolute; right:8px; bottom:14px; width:58px; height:58px; }
#hud .abil canvas { position:absolute; left:0; top:0; width:58px; height:58px; }
#hud .abil span { position:absolute; }
#hud .abil #oilI { left:14px; top:13px; }
#hud .abil .alb { left:50%; transform:translateX(-50%); bottom:-13px; font-size:10.5px; font-weight:700; white-space:nowrap; background:var(--paperHi); padding:0 4px; border-bottom:1px solid var(--ink); }
#hud .abil .acd { left:0; right:0; top:18px; text-align:center; font-size:17px; font-weight:700; color:var(--cin); text-shadow:0 0 3px #F5EFE1, 0 0 2px #F5EFE1; }
#hud .abil:not(.ready) #oilI { opacity:.28; }
#hud .abil.ready .alb { color:var(--cin); }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas><div id="hud"></div></div>
<script>
