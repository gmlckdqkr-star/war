:root { --ink:#1E1916; --ink2:#3A322B; --paper:#E8DFCB; --paperHi:#F5EFE1; --cin:#B3271D; --gold:#C8962D; --indigo:#2B4A78; }
html, body { margin:0; height:100%; background:#1E1916; overflow:hidden; -webkit-font-smoothing:antialiased; }
#stage { position:relative; width:100vw; height:100vh; }
canvas#c { position:absolute; left:0; top:0; display:block; }
#hud { position:absolute; inset:0; pointer-events:none; font-family:'Gowun Batang', 'Noto Serif KR', 'Nanum Myeongjo', serif; color:var(--ink); letter-spacing:-0.01em; }
#hud .slip { position:absolute; top:0; height:29px; display:flex; align-items:center; gap:5px; padding:0 11px 3px; background-color:#E8DFCB; background-image:var(--paperimg); background-size:256px 128px; box-shadow:0 1px 0 rgba(30,25,22,.35); }
#hud .top-l { left:0; padding-left:12px; }
#hud .top-r { right:0; padding-right:12px; }
#hud .book { font-size:10.5px; color:var(--cin); font-weight:700; letter-spacing:.04em; margin-right:2px; }
#hud .castle { font-size:15px; font-weight:700; letter-spacing:-.02em; }
#hud .lbl { font-size:11px; color:var(--ink2); }
#hud .wave { font-size:12px; font-weight:700; color:var(--cin); }
#hud .sep { width:1px; height:15px; background:rgba(30,25,22,.35); margin:0 4px; }
#hud #keepTxt { font-size:13px; }
#hud .kbar canvas { width:64px; height:10px; display:block; }
#hud .chron { position:absolute; top:33px; left:50%; transform:translateX(-50%); max-width:470px; padding:3px 11px 4px 20px; font-size:11px; line-height:1.35; color:var(--ink2); background:rgba(245,239,225,.9); border-bottom:1.5px solid var(--ink); opacity:0; transition:opacity .4s; white-space:nowrap; }
#hud .chron.on { opacity:1; }
#hud .chron .rub { position:absolute; left:7px; top:6px; width:7px; height:9px; background:var(--cin); transform:skewX(-8deg); }
#hud .chron .by { margin-left:9px; font-size:10px; color:var(--cin); }
#hud .bark { position:absolute; max-width:196px; padding:2px 8px 3px; font-size:10.5px; line-height:1.3; background:var(--paperHi); border:1.4px solid var(--ink); border-radius:1px 6px 2px 5px; box-shadow:2px 2px 0 rgba(30,25,22,.25); }
#hud .bark b { display:block; font-size:9.5px; color:var(--cin); letter-spacing:.02em; }
#hud .bark::after { content:''; position:absolute; left:12px; bottom:-7px; width:9px; height:7px; background:var(--ink); clip-path:polygon(0 0,100% 0,15% 100%); }
#hud .cards { position:absolute; right:76px; bottom:8px; display:flex; gap:6px; }
#hud .card { position:relative; width:152px; height:46px; }
#hud .card.sel { transform:translateY(-3px); }
#hud .card .cbg { position:absolute; inset:0; }
#hud .card .em { position:absolute; left:5px; top:7px; }
#hud .card .nm { position:absolute; left:38px; top:6px; right:6px; font-size:11.5px; font-weight:700; letter-spacing:-.04em; white-space:nowrap; overflow:hidden; }
#hud .card .ct { position:absolute; left:38px; top:21px; font-size:14px; font-weight:700; line-height:18px; }
#hud .card .ct i { font-style:normal; font-size:10px; color:var(--ink2); font-weight:400; }
#hud .card .st { position:absolute; right:9px; top:24px; font-size:10.5px; color:var(--ink2); }
#hud .card .st.red { color:var(--cin); font-weight:700; }
#hud .card .st.warn { color:var(--gold); font-weight:700; }
#hud .card .mb { position:absolute; left:72px; top:29px; }
#hud .abil { position:absolute; right:8px; bottom:14px; width:58px; height:58px; }
#hud .abil canvas { position:absolute; left:0; top:0; width:58px; height:58px; }
#hud .abil span { position:absolute; }
#hud .abil #oilI { left:14px; top:13px; }
#hud .abil .alb { left:50%; transform:translateX(-50%); bottom:-13px; font-size:10.5px; font-weight:700; white-space:nowrap; background:var(--paperHi); padding:0 4px; border-bottom:1px solid var(--ink); }
#hud .abil .acd { left:0; right:0; top:18px; text-align:center; font-size:17px; font-weight:700; color:var(--cin); text-shadow:0 0 3px #F5EFE1, 0 0 2px #F5EFE1; }
#hud .abil:not(.ready) #oilI { opacity:.28; }
#hud .abil.ready .alb { color:var(--cin); }
</style>

<body>
<div id="stage"><canvas id="c"></canvas><div id="hud"></div></div>
<script>
// ---- core.js ----
'use strict';
// ============================================================================
// 잿빛 성벽 — "먹과 안료의 연대기" prototype. Everything here is drawn by code.
// core: params, deterministic RNG, palette, projection, ink/brush helpers
// ============================================================================
const Q = new URLSearchParams(location.search);
const PARAM = {
  t: Math.max(0, +Q.get('t') || 0),
  zoom: +Q.get('zoom') || 0,
  sheet: Q.get('sheet') === '1',
  ui: Q.get('ui') === '1',
  n: Math.max(20, Math.min(600, +Q.get('n') || 100)),
  seed: +Q.get('seed') || 7,
  low: Q.get('tier') === 'low',
  hud: Q.get('hud') !== '0',
  still: Q.get('still') === '1',
  cx: +Q.get('cx') || 0, cy: +Q.get('cy') || 0,
  prof: Q.get('prof') === '1',
  off: new Set((Q.get('off') || '').split(',')),
};
const DPR = Math.min(window.devicePixelRatio || 1, PARAM.low ? 1.25 : 2);
const DT = 1 / 30;

// --- deterministic RNG (sim) and hash (render-only variation) ----------------
function RNG(seed) {

// quadratic bezier sample
function qpts(x0, y0, cx, cy, x1, y1, n = 8) {
  const out = [];

    const t = i / n, a = (1 - t) * (1 - t), b = 2 * (1 - t) * t, c = t * t;

}
// Tapered brush stroke along a polyline; wfn(u) gives the full width at u in [0,1].
function brush(g, pts, wfn, color, alpha = 1) {
  const n = pts.length; if (n < 2) return;

    const p = pts[i], a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
    let dx = b[0] - a[0], dy = b[1] - a[1];

    const w = wfn(i / (n - 1)) * 0.5;
    L.push([p[0] - dy * w, p[1] + dx * w]);
    R.push([p[0] + dy * w, p[1] - dx * w]);
  }
  g.beginPath();
  g.moveTo(L[0][0], L[0][1]);
  for (let i = 1; i < n; i++) g.lineTo(L[i][0], L[i][1]);
  for (let i = n - 1; i >= 0; i--) g.lineTo(R[i][0], R[i][1]);

  g.globalAlpha = ga;
}

// Irregular ink blob (wet edge), seeded.
function inkBlob(g, x, y, r, seed, color, alpha = 1, sq = 1) {
  const n = 14;
  g.beginPath();
  for (let i = 0; i <= n; i++) {
    const a = (i / n) * Math.PI * 2;
    const k = 0.72 + 0.5 * hash2(seed, i % n);
    const px = x + Math.cos(a) * r * k, py = y + Math.sin(a) * r * k * sq;
    if (i === 0) g.moveTo(px, py); else g.lineTo(px, py);
  }
  g.closePath();
  const ga = g.globalAlpha; g.globalAlpha = ga * alpha; g.fillStyle = color; g.fill(); g.globalAlpha = ga;
}
// Ink splatter: core blob + droplets + a drag tail
function splat(g, x, y, r, seed, color, alpha = 1, dirx = 1, diry = 0) {
  inkBlob(g, x, y, r, seed, color, alpha, 0.7);
  for (let i = 0; i < 7; i++) {
    const a = Math.atan2(diry, dirx) + (hash2(seed, 40 + i) - 0.5) * 2.2;
    const d = r * (1.1 + hash2(seed, 60 + i) * 1.8);

function hatch(g, x0, y0, x1, y1, ang, gap, w, color, alpha, seed = 1) {
  const ca = Math.cos(ang), sa = Math.sin(ang);

  for (let d = -R; d <= R; d += gap, i++) {
    const ox = cx - sa * d, oy = cy + ca * d;
    // break each line into 2-3 dashes (hand gouge)
    let s = -R;
    while (s < R) {
      const len = R * (0.35 + 0.8 * hash2(seed + i, Math.floor(s))) ;
      const e = Math.min(R, s + len);
      g.moveTo(ox + ca * s, oy + sa * s);
      g.lineTo(ox + ca * e, oy + sa * e);

function wobLine(g, x0, y0, x1, y1, amp, seed) {
  const n = Math.max(2, Math.ceil(Math.hypot(x1 - x0, y1 - y0) / 3));

    g.lineTo(x0 + dx * i + nx * j, y0 + dy * i + ny * j);

}

function ik(ax, ay, bx, by, l1, l2, bend) {
  let dx = bx - ax, dy = by - ay, d = Math.hypot(dx, dy);
  const md = l1 + l2 - 0.02;
  if (d > md) { const k = md / d; dx *= k; dy *= k; bx = ax + dx; by = ay + dy; d = md; }
  if (d < 0.05) d = 0.05;
  const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
  const h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
  const mx = ax + (dx * a) / d, my = ay + (dy * a) / d;
  return [mx + (bend * -dy * h) / d, my + (bend * dx * h) / d, bx, by];
}

  } else if (anim === 'hit') {
    p.lean -= 0.34; p.hx = -0.9 * sc; p.hy += 0.35 * sc; p.ff = [1.7 * sc, 0]; p.bf = [-1.5 * sc, 0];
    fh = [fh[0] - 0.6, fh[1] - 2.0]; p.wa -= 0.45;
  } else if (anim === 'die') {
    p.lean -= 0.55; p.hx = -1.3 * sc; p.hy += 1.6 * sc; p.ff = [1.3 * sc, 0]; p.bf = [-1.9 * sc, 0];
    fh = [fh[0] - 0.4, fh[1] - 3.2]; bh = [bh[0] - 1.6, bh[1] - 1.8]; p.wa += 0.8;
    if (f === 1) { p.rot = -0.8; p.rx = -1.4 * sc; p.ry = 0.6; }
  } else if (anim === 'dead') {
    p.flat = true;
    p.lean += [-0.2, 0.25, 0.6][f]; p.hy += [0.2, 0.2, 1.4][f] * sc;
    p.ff = [[1.8, 0], [1.4, -0.6], [2.4, -1.0]][f].map((v) => v * sc); p.bf = [[-1.4, 0], [-2.0, 0.6], [0.4, -0.8]][f].map((v) => v * sc);
    fh = S([[1.8, -1.2], [3.2, 2.0], [2.6, 3.4]][f]); bh = S([[-2.6, 0.6], [-1.2, 4.2], [1.6, 4.0]][f]);
    p.rot = [-1.5, 1.48, -1.35][f]; p.rx = [-0.5, 0.6, -0.2][f] * sc; p.ry = [-1.0, -1.2, -1.4][f];
    p.wa += [0.6, -0.4, 0.9][f];
  } else if (anim === 'climb') {
    p.lean = 0.12; p.hy += 0.4;
    const up = f === 0;
    fh = S(up ? [1.7, -3.4] : [1.4, -0.6]); bh = S(up ? [1.0, -0.8] : [1.2, -3.6]);
    p.ff = up ? [1.4 * sc, -2.2 * sc] : [0.7 * sc, 0]; p.bf = up ? [0.4 * sc, 0] : [1.3 * sc, -2.2 * sc];
  }
  p.fh = fh; p.bh = bh; p.tl = tl;
  return p;
}

// ---------------------------------------------------------------------------
// Drawing in local space (facing +x). `mis` = pigment offset in local coords.
function drawFigure(g, K, v, anim, f, dir) {
  const B = BODY[K.body];
  const p = makePose(K, anim, f);
  const mx = MIS[0] * dir, my = MIS[1];
  g.save();
  g.scale(dir, 1);
  if (p.rot) { g.translate(p.rx, p.ry); g.rotate(p.rot); }
  g.lineCap = 'round'; g.lineJoin = 'round';

  const hip = [p.hx, p.hy];
  const S0 = rot(0, -p.tl, p.lean); const sh = [hip[0] + S0[0], hip[1] + S0[1]];
  const H0 = rot(B.headFwd, -p.tl - B.neck - B.headR * 0.35, p.lean);
  const head = [hip[0] + H0[0], hip[1] + H0[1]];
  const fShoulder = [sh[0] + rot(0.7, 0.4, p.lean)[0], sh[1] + rot(0.7, 0.4, p.lean)[1]];
  const bShoulder = [sh[0] + rot(-0.9, 0.4, p.lean)[0], sh[1] + rot(-0.9, 0.4, p.lean)[1]];
  const fhand = [sh[0] + p.fh[0], sh[1] + p.fh[1]];
  const bhand = [sh[0] + p.bh[0], sh[1] + p.bh[1]];

  const pigment = (fn, col) => { if (!col) return; g.save(); g.translate(mx, my); fn(); g.fillStyle = col; g.fill(); g.restore(); };
  const inkStroke = (fn, w = OL * 2) => { fn(); g.strokeStyle = P.ink; g.lineWidth = w; g.stroke(); };
  const limb = (pts, w, col) => {
    const path = () => { g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]); };
    path(); g.strokeStyle = P.ink; g.lineWidth = w + OL * 2; g.stroke();
    if (col) { g.save(); g.translate(mx, my); path(); g.strokeStyle = col; g.lineWidth = w * 0.92; g.stroke(); g.restore(); }
  };
  const leg = (hipOff, foot, col) => {
    const hj = [hip[0] + hipOff, hip[1]];
    const k = ik(hj[0], hj[1], foot[0], foot[1], B.thigh, B.shin, -1);
    limb([hj, [k[0], k[1]], [k[2], k[3]]], B.legW, col);
    // boot / foot
    g.beginPath(); g.ellipse(k[2] + 0.55, k[3] - 0.35, B.legW * 0.75, B.legW * 0.42, 0, 0, Math.PI * 2);
    g.fillStyle = P.ink; g.fill();
  };
  const arm = (shp, hand, col, w = B.armW) => {
    const k = ik(shp[0], shp[1], hand[0], hand[1], B.ua, B.fa, 1);
    limb([shp, [k[0], k[1]], [k[2], k[3]]], w, col);
    const sk = K.skin || P.skin;
    g.beginPath(); g.arc(k[2], k[3], w * 0.5, 0, Math.PI * 2); g.fillStyle = P.ink; g.fill();
    g.beginPath(); g.arc(k[2] + mx * 0.6, k[3] + my * 0.6, w * 0.3, 0, Math.PI * 2); g.fillStyle = sk; g.fill();
    return [k[2], k[3]];
  };
  const armCol = K.sleeve || K.skin;
  const legCol = K.legs || K.skin;

  // ---- back leg, back arm, back gear
  leg(-0.45, p.bf, legCol ? mix(legCol, P.ink, 0.25) : null);
  if (K.back === 'quiver' && anim !== 'dead') {
    const q0 = [sh[0] - 1.6, sh[1] - 1.2], q1 = [hip[0] - 1.9, hip[1] - 0.2];
    limb([q0, q1], 1.3, P.wood);
    for (let i = 0; i < 3; i++) { g.beginPath(); g.moveTo(q0[0] - 0.4 + i * 0.45, q0[1]); g.lineTo(q0[0] - 0.7 + i * 0.5, q0[1] - 1.3); g.strokeStyle = P.paperHi; g.lineWidth = 0.45; g.stroke(); }
  }
  const bArm = arm(bShoulder, bhand, armCol ? mix(armCol, P.ink, 0.3) : null);
  if (K.back === 'roundShield') {
    const c = [sh[0] - 1.9, sh[1] + 2.2];
    pigment(() => { g.beginPath(); g.arc(c[0], c[1], 2.4, 0, 7); }, P.indigoLo);
    g.beginPath(); g.arc(c[0], c[1], 2.4, 0, 7); g.strokeStyle = P.ink; g.lineWidth = OL * 2; g.stroke();
    g.beginPath(); g.arc(c[0], c[1], 1.75, -2.2, 0.3); g.strokeStyle = P.paperHi; g.lineWidth = 0.4; g.stroke();
  }
  if (K.wpn === 'axe2') drawWeapon(g, K, 'axe', bArm, p.wa + 0.6, mx, my);

  // ---- front leg
  leg(0.45, p.ff, legCol);

  // ---- torso
  const tl = p.tl, hd = B.hemY - B.hipY;
  const tpts = [
    [-B.shW * 0.5, -tl], [B.shW * 0.42, -tl], [B.shW * 0.5 + 0.25, -tl * 0.55], [B.hemW * 0.42, -tl * 0.12],
    [B.hemW * 0.5, hd], [B.hemW * 0.18, hd + 0.35], [-B.hemW * 0.2, hd + 0.2], [-B.hemW * 0.5, hd], [-B.shW * 0.55 - 0.15, -tl * 0.25],
  ].map((q) => { const r = rot(q[0], q[1], p.lean); return [hip[0] + r[0], hip[1] + r[1]]; });
  if (K.ragged) {
    // zig-zag hem: replace the bottom edge
    const a = tpts[4], b = tpts[7];
    const zz = [];
    for (let i = 0; i <= 5; i++) { const t = i / 5; zz.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t + (i % 2 ? -0.75 : 0.35)]); }
    tpts.splice(4, 4, ...zz);
  }
  const torsoPath = () => poly(g, tpts);
  const torsoCol = K.bare ? K.skin : K.tunic;
  pigment(torsoPath, torsoCol);
  if (K.mail) { // mail skirt: dotted
    g.save(); torsoPath(); g.clip();
    g.fillStyle = hexA(P.ink, 0.55);
    for (let yy = -tl * 0.3; yy < hd + 0.5; yy += 0.75) for (let xx = -3.2; xx < 3.2; xx += 0.75) {
      const r = rot(xx + ((yy * 4) % 1.5) * 0.25, yy, p.lean); g.fillRect(hip[0] + r[0], hip[1] + r[1], 0.32, 0.32);
    }
    g.restore();
  }
  if (K.tabard && anim !== 'dead') { // white tabard band (blue-and-white = our colours)
    const t0 = rot(B.shW * 0.1, -tl + 0.4, p.lean), t1 = rot(B.hemW * 0.12, hd - 0.2, p.lean);
    limb([[hip[0] + t0[0], hip[1] + t0[1]], [hip[0] + t1[0], hip[1] + t1[1]]], 1.25, P.paperHi);
  }
  if (K.mantle) { // fur mantle on orc shoulders
    const m = [];
    for (let i = 0; i <= 7; i++) { const t = i / 7; const xx = -B.shW * 0.62 + t * B.shW * 1.18; m.push(rot(xx, -tl - 0.6 + (i % 2 ? 1.6 : 0.4), p.lean)); }
    const mp = () => { g.beginPath(); m.forEach((q, i) => (i ? g.lineTo(hip[0] + q[0], hip[1] + q[1]) : g.moveTo(hip[0] + q[0], hip[1] + q[1]))); const e = rot(B.shW * 0.5, -tl - 1.2, p.lean), s = rot(-B.shW * 0.6, -tl - 1.0, p.lean); g.lineTo(hip[0] + e[0], hip[1] + e[1]); g.lineTo(hip[0] + s[0], hip[1] + s[1]); g.closePath(); };
    pigment(mp, P.fur); inkStroke(mp, OL * 1.6);
  }
  if (K.paint) { // berserker war paint
    for (let i = 0; i < 3; i++) { const a = rot(-1.6 + i * 1.3, -tl * 0.75, p.lean), b = rot(-0.6 + i * 1.3, -tl * 0.25, p.lean); limb([[hip[0] + a[0], hip[1] + a[1]], [hip[0] + b[0], hip[1] + b[1]]], 0.45, P.cinnabar); }
    const kb = rot(0, hd - 0.6, p.lean); // fur kilt
    const kp = () => { g.beginPath(); g.ellipse(hip[0] + kb[0], hip[1] + kb[1], B.hemW * 0.55, 1.4, p.lean, 0, 7); };
    pigment(kp, P.fur); inkStroke(kp, OL * 1.4);
  }
  // belt
  { const a = rot(-B.shW * 0.55, -tl * 0.2, p.lean), b = rot(B.hemW * 0.45, -tl * 0.12, p.lean); g.beginPath(); g.moveTo(hip[0] + a[0], hip[1] + a[1]); g.lineTo(hip[0] + b[0], hip[1] + b[1]); g.strokeStyle = P.ink; g.lineWidth = 0.55; g.stroke(); }
  if (K.apron && anim !== 'dead') { const a = rot(B.shW * 0.12, -tl * 0.35, p.lean), b = rot(B.hemW * 0.2, hd + 0.1, p.lean); limb([[hip[0] + a[0], hip[1] + a[1]], [hip[0] + b[0], hip[1] + b[1]]], 2.0, P.paperHi); }
  if (K.beltBadge) { const c = rot(B.shW * 0.1, -tl * 0.7, p.lean); g.beginPath(); g.arc(hip[0] + c[0], hip[1] + c[1], 0.6, 0, 7); g.fillStyle = P.gold; g.fill(); }
  inkStroke(torsoPath);
  // shade line down the back
  { const a = rot(-B.shW * 0.25, -tl * 0.85, p.lean), b = rot(-B.hemW * 0.3, hd - 0.3, p.lean); g.beginPath(); g.moveTo(hip[0] + a[0], hip[1] + a[1]); g.lineTo(hip[0] + b[0], hip[1] + b[1]); g.strokeStyle = hexA(P.ink, 0.45); g.lineWidth = 0.4; g.stroke(); }

  // ---- head
  drawHead(g, K, v, head, B.headR, p, mx, my);

  // ---- weapon + front arm
  const wpn = K.wpn;
  if (wpn === 'ladder') drawLadderCarry(g, sh, mx, my);
  if (wpn === 'bow') {
    drawBow(g, K, fhand, bhand, p, mx, my);
  } else if (wpn !== 'ladder' && !(anim === 'climb')) {
    drawWeapon(g, K, wpn === 'axe2' ? 'axe' : wpn, fhand, p.wa, mx, my);
  } else if (anim === 'climb' && wpn !== 'ladder') {
    // weapon slung on the back while climbing
    const a = [sh[0] - 1.5, sh[1] - 2], b = [hip[0] - 1.8, hip[1] + 1.5];
    limb([a, b], 0.5, P.wood);
  }
  arm(fShoulder, fhand, armCol);
  if (K.shield) drawShield(g, K, bhand, p, mx, my, anim);
  g.restore();
}

function drawHead(g, K, v, c, r, p, mx, my) {
  const type = K.heads[v % K.heads.length];
  const skin = K.skin || P.skin;
  const x = c[0], y = c[1];
  const faceP = () => { g.beginPath(); if (K.body === 'orc') { g.ellipse(x + 0.15, y + 0.15, r * 1.05, r * 0.98, 0, 0, 7); } else g.arc(x, y, r, 0, 7); };
  g.save(); g.translate(mx, my); faceP(); g.fillStyle = skin; g.fill(); g.restore();
  faceP(); g.strokeStyle = P.ink; g.lineWidth = OL * 2; g.stroke();
  // eye
  g.beginPath(); g.arc(x + r * 0.5, y - r * 0.05, Math.max(0.22, r * 0.14), 0, 7); g.fillStyle = P.ink; g.fill();
  const fillInk = (fn) => { fn(); g.fillStyle = P.ink; g.fill(); };
  const pig = (fn, col) => { g.save(); g.translate(mx, my); fn(); g.fillStyle = col; g.fill(); g.restore(); fn(); g.strokeStyle = P.ink; g.lineWidth = OL * 2; g.stroke(); };
  switch (type) {
    case 'nasal':
      fillInk(() => { g.beginPath(); g.moveTo(x - r * 1.08, y + r * 0.12); g.quadraticCurveTo(x - r * 1.0, y - r * 1.2, x - r * 0.05, y - r * 1.7); g.quadraticCurveTo(x + r * 0.95, y - r * 1.1, x + r * 1.05, y + r * 0.08); g.closePath(); });
      g.beginPath(); g.moveTo(x + r * 0.92, y - r * 0.1); g.lineTo(x + r * 1.0, y + r * 0.75); g.strokeStyle = P.ink; g.lineWidth = 0.55; g.stroke();
      break;
    case 'kettle':
      fillInk(() => { g.beginPath(); g.arc(x, y - r * 0.2, r * 1.02, Math.PI, 0); g.closePath(); });
      g.beginPath(); g.moveTo(x - r * 1.75, y - r * 0.05); g.quadraticCurveTo(x, y - r * 0.45, x + r * 1.75, y + r * 0.05); g.strokeStyle = P.ink; g.lineWidth = 0.75; g.stroke();
      break;
    case 'spangen':
      fillInk(() => { g.beginPath(); g.ellipse(x, y - r * 0.3, r * 1.08, r * 1.22, 0, Math.PI, 0); g.closePath(); });
      g.beginPath(); g.moveTo(x, y - r * 1.5); g.lineTo(x, y - r * 0.3); g.strokeStyle = P.goldHi; g.lineWidth = 0.4; g.stroke();
      g.beginPath(); g.moveTo(x + r * 0.8, y - r * 0.2); g.lineTo(x + r * 0.82, y + r * 0.6); g.strokeStyle = P.ink; g.lineWidth = 0.5; g.stroke();
      break;
    case 'hood': case 'hoodR': {
      const col = type === 'hood' ? K.tunic : P.rust;
      pig(() => { g.beginPath(); g.moveTo(x + r * 0.95, y + r * 1.0); g.quadraticCurveTo(x + r * 1.2, y - r * 1.3, x - r * 0.1, y - r * 1.28); g.quadraticCurveTo(x - r * 1.5, y - r * 1.1, x - r * 2.3, y + r * 0.7); g.lineTo(x - r * 0.9, y + r * 1.35); g.closePath(); }, col);
      g.beginPath(); g.ellipse(x + r * 0.42, y + r * 0.12, r * 0.55, r * 0.72, 0, 0, 7); g.fillStyle = skin; g.fill();
      g.beginPath(); g.arc(x + r * 0.62, y - r * 0.02, Math.max(0.2, r * 0.13), 0, 7); g.fillStyle = P.ink; g.fill();
      break;
    }
    case 'kerchief': // a cinnabar headscarf knotted at the nape: townsfolk, never soldiers
      pig(() => { g.beginPath(); g.moveTo(x + r * 0.9, y - r * 0.2); g.quadraticCurveTo(x + r * 0.6, y - r * 1.35, x - r * 0.3, y - r * 1.2); g.quadraticCurveTo(x - r * 1.3, y - r * 0.9, x - r * 1.15, y + r * 0.3); g.lineTo(x - r * 1.9, y + r * 0.9); g.lineTo(x - r * 1.0, y + r * 0.6); g.closePath(); }, P.cinnabar);
      break;
    case 'band':
      fillInk(() => { g.beginPath(); g.moveTo(x - r * 1.05, y + r * 0.5); g.quadraticCurveTo(x - r * 1.2, y - r * 1.25, x + r * 0.2, y - r * 1.12); g.quadraticCurveTo(x + r * 1.0, y - r * 0.9, x + r * 0.9, y - r * 0.35); g.lineTo(x - r * 0.3, y - r * 0.45); g.closePath(); });
      g.beginPath(); g.moveTo(x - r * 1.0, y - r * 0.35); g.lineTo(x + r * 0.95, y - r * 0.5); g.strokeStyle = P.paperHi; g.lineWidth = 0.55; g.stroke();
      break;
    case 'bare':
      fillInk(() => { g.beginPath(); g.moveTo(x - r * 1.1, y + r * 0.6); for (let i = 0; i <= 6; i++) { const a = Math.PI * (1.05 + i * 0.16); const rr = r * (i % 2 ? 1.28 : 1.05); g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } g.lineTo(x + r * 0.2, y - r * 0.5); g.lineTo(x - r * 0.5, y); g.closePath(); });
      g.beginPath(); g.moveTo(x + r * 0.2, y + r * 0.75); g.quadraticCurveTo(x + r * 0.7, y + r * 1.3, x + r * 1.0, y + r * 0.55); g.strokeStyle = P.ink; g.lineWidth = 0.6; g.stroke();
      break;
    case 'kettleB':
      fillInk(() => { g.beginPath(); g.arc(x, y - r * 0.25, r * 1.05, Math.PI, 0); g.closePath(); });
      g.beginPath(); g.moveTo(x - r * 2.0, y + r * 0.15); g.quadraticCurveTo(x, y - r * 0.55, x + r * 2.0, y + r * 0.2); g.strokeStyle = P.ink; g.lineWidth = 0.9; g.stroke();
      break;
    case 'bascinet':
      fillInk(() => { g.beginPath(); g.moveTo(x - r * 1.1, y + r * 0.9); g.quadraticCurveTo(x - r * 1.25, y - r * 1.2, x - r * 0.4, y - r * 1.75); g.quadraticCurveTo(x + r * 1.3, y - r * 0.6, x + r * 1.6, y + r * 0.35); g.lineTo(x + r * 0.6, y + r * 1.0); g.closePath(); });
      g.beginPath(); g.moveTo(x + r * 0.1, y - r * 0.15); g.lineTo(x + r * 1.15, y - r * 0.05); g.strokeStyle = P.paperHi; g.lineWidth = 0.35; g.stroke();
      break;
    case 'capBrim':
      pig(() => { g.beginPath(); g.ellipse(x - r * 0.1, y - r * 0.55, r * 1.12, r * 0.75, -0.15, Math.PI * 0.95, Math.PI * 2.05); g.closePath(); }, P.cream);
      g.beginPath(); g.moveTo(x - r * 0.4, y - r * 0.3); g.lineTo(x + r * 1.9, y - r * 0.15); g.strokeStyle = P.ink; g.lineWidth = 0.65; g.stroke();
      g.beginPath(); g.moveTo(x - r * 0.6, y - r * 0.9); g.quadraticCurveTo(x - r * 2.0, y - r * 2.1, x - r * 2.6, y - r * 1.5); g.strokeStyle = P.paperHi; g.lineWidth = 0.6; g.stroke();
      break;
    case 'topknot': case 'horned': case 'mohawk': case 'bald': {
      // heavy brow + jaw with tusk
      g.beginPath(); g.moveTo(x + r * 0.05, y - r * 0.35); g.lineTo(x + r * 1.05, y - r * 0.25); g.strokeStyle = P.ink; g.lineWidth = 0.6; g.stroke();
      g.beginPath(); g.moveTo(x + r * 0.55, y + r * 0.7); g.lineTo(x + r * 0.9, y + r * 0.05); g.lineTo(x + r * 1.0, y + r * 0.72); g.closePath(); g.fillStyle = P.bone; g.fill(); g.strokeStyle = P.ink; g.lineWidth = 0.3; g.stroke();
      if (type === 'topknot') fillInk(() => { g.beginPath(); g.moveTo(x - r * 0.6, y - r * 0.85); g.quadraticCurveTo(x - r * 0.9, y - r * 2.0, x - r * 0.1, y - r * 2.1); g.quadraticCurveTo(x - r * 1.6, y - r * 2.6, x - r * 1.8, y - r * 1.4); g.lineTo(x - r * 0.95, y - r * 0.55); g.closePath(); });
      if (type === 'horned') {
        fillInk(() => { g.beginPath(); g.arc(x, y - r * 0.2, r * 1.06, Math.PI, 0); g.closePath(); });
        g.beginPath(); g.moveTo(x - r * 0.7, y - r * 0.9); g.quadraticCurveTo(x - r * 2.2, y - r * 1.3, x - r * 1.9, y - r * 2.6); g.lineWidth = 0.9; g.strokeStyle = P.ink; g.stroke(); g.lineWidth = 0.5; g.strokeStyle = P.bone; g.stroke();
      }
      if (type === 'mohawk') {
        fillInk(() => { g.beginPath(); g.moveTo(x - r * 1.0, y - r * 0.6); for (let i = 0; i < 5; i++) { const a = Math.PI * (1.08 + i * 0.2); g.lineTo(x + Math.cos(a) * r * 1.0, y + Math.sin(a) * r * 1.0); g.lineTo(x + Math.cos(a + 0.3) * r * 1.85, y + Math.sin(a + 0.3) * r * 1.85); } g.lineTo(x + r * 0.6, y - r * 0.8); g.closePath(); });
      }
      if (type === 'mohawk' || type === 'bald') { g.beginPath(); g.moveTo(x - r * 0.2, y - r * 0.1); g.lineTo(x + r * 1.0, y); g.strokeStyle = P.cinnabar; g.lineWidth = 0.55; g.stroke(); }
      break;
    }
    case 'ears': case 'pot': {
      // long ear (back), nose (front)
      const ear = () => { g.beginPath(); g.moveTo(x - r * 0.5, y - r * 0.2); g.lineTo(x - r * 2.6, y - r * 1.15); g.lineTo(x - r * 0.65, y + r * 0.45); g.closePath(); };
      g.save(); g.translate(mx, my); ear(); g.fillStyle = skin; g.fill(); g.restore(); ear(); g.strokeStyle = P.ink; g.lineWidth = OL * 1.6; g.stroke();
      g.beginPath(); g.moveTo(x + r * 0.85, y - r * 0.15); g.lineTo(x + r * 1.55, y + r * 0.3); g.lineTo(x + r * 0.8, y + r * 0.45); g.fillStyle = skin; g.fill(); g.strokeStyle = P.ink; g.lineWidth = 0.35; g.stroke();
      if (type === 'pot') fillInk(() => { g.beginPath(); g.moveTo(x - r * 1.1, y - r * 0.15); g.lineTo(x - r * 0.9, y - r * 1.25); g.lineTo(x + r * 0.95, y - r * 1.25); g.lineTo(x + r * 1.15, y - r * 0.15); g.closePath(); });
      break;
    }
  }
}

function drawWeapon(g, K, w, hand, a, mx, my) {
  const ca = Math.cos(a), sa = Math.sin(a);
  const [x, y] = hand;
  if (w === 'spear' || w === 'bill') {
    const L = K.wlen, b = [x - ca * L * 0.34, y - sa * L * 0.34], t = [x + ca * L * 0.66, y + sa * L * 0.66];
    g.beginPath(); g.moveTo(b[0], b[1]); g.lineTo(t[0], t[1]); g.strokeStyle = P.ink; g.lineWidth = 0.75; g.stroke();
    g.beginPath(); g.moveTo(b[0] + mx, b[1] + my); g.lineTo(t[0] + mx, t[1] + my); g.strokeStyle = P.woodHi; g.lineWidth = 0.28; g.stroke();
    // blade
    const n = [-sa, ca];
    const tip = [t[0] + ca * 2.6, t[1] + sa * 2.6];
    g.beginPath(); g.moveTo(t[0] + n[0] * 0.7, t[1] + n[1] * 0.7); g.lineTo(tip[0], tip[1]); g.lineTo(t[0] - n[0] * 0.7, t[1] - n[1] * 0.7); g.closePath();
    g.fillStyle = P.paperHi; g.fill(); g.strokeStyle = P.ink; g.lineWidth = 0.38; g.stroke();
    if (w === 'bill') { g.beginPath(); g.moveTo(t[0] - ca * 0.6, t[1] - sa * 0.6); g.quadraticCurveTo(t[0] - n[0] * 2.2, t[1] - n[1] * 2.2, t[0] - n[0] * 1.6 - ca * 1.6, t[1] - n[1] * 1.6 - sa * 1.6); g.strokeStyle = P.ink; g.lineWidth = 0.55; g.stroke(); }
    // pennon on our spears: a single indigo tongue
    if (K.side === 0) { g.beginPath(); g.moveTo(t[0] - ca * 0.6, t[1] - sa * 0.6); g.lineTo(t[0] - ca * 0.6 - n[0] * 0 - 1.8, t[1] - sa * 0.6 + 0.9); g.lineTo(t[0] - ca * 1.9, t[1] - sa * 1.9); g.closePath(); g.fillStyle = P.indigo; g.fill(); }
  } else if (w === 'sword') {
    const L = K.wlen, t = [x + ca * L, y + sa * L];
    g.beginPath(); g.moveTo(x, y); g.lineTo(t[0], t[1]); g.strokeStyle = P.ink; g.lineWidth = 1.15; g.stroke();
    g.beginPath(); g.moveTo(x + ca * 0.6, y + sa * 0.6); g.lineTo(t[0] - ca * 0.3, t[1] - sa * 0.3); g.strokeStyle = P.paperHi; g.lineWidth = 0.42; g.stroke();
    const n = [-sa, ca];
    g.beginPath(); g.moveTo(x + n[0] * 1.1, y + n[1] * 1.1); g.lineTo(x - n[0] * 1.1, y - n[1] * 1.1); g.strokeStyle = P.ink; g.lineWidth = 0.6; g.stroke();
  } else if (w === 'cleaver' || w === 'axe') {
    const L = w === 'axe' ? 5.4 : K.wlen, t = [x + ca * L, y + sa * L], n = [-sa, ca];
    g.beginPath(); g.moveTo(x - ca * 1.2, y - sa * 1.2); g.lineTo(t[0], t[1]); g.strokeStyle = P.ink; g.lineWidth = 0.8; g.stroke();
    const bw = w === 'axe' ? 2.0 : 2.8, bl = w === 'axe' ? 2.0 : 3.6;
    const b0 = [t[0] - ca * bl, t[1] - sa * bl];
    g.beginPath(); g.moveTo(b0[0], b0[1]); g.lineTo(t[0], t[1]); g.lineTo(t[0] + n[0] * bw, t[1] + n[1] * bw); g.quadraticCurveTo(b0[0] + n[0] * bw * 1.4, b0[1] + n[1] * bw * 1.4, b0[0] + n[0] * bw * 0.8 - ca * 0.6, b0[1] + n[1] * bw * 0.8 - sa * 0.6); g.closePath();
    g.fillStyle = P.stoneMid; g.fill(); g.strokeStyle = P.ink; g.lineWidth = 0.5; g.stroke();
    g.beginPath(); g.moveTo(t[0] + n[0] * bw * 0.9, t[1] + n[1] * bw * 0.9); g.quadraticCurveTo(b0[0] + n[0] * bw * 1.3, b0[1] + n[1] * bw * 1.3, b0[0] + n[0] * bw * 0.75, b0[1] + n[1] * bw * 0.75); g.strokeStyle = P.paperHi; g.lineWidth = 0.4; g.stroke();
  } else if (w === 'bucket') {
    // a wooden pail on a rope handle, slopping water
    const bx = x + 0.2, by = y + 1.1;
    g.beginPath(); g.moveTo(x, y); g.lineTo(bx - 1.0, by); g.moveTo(x, y); g.lineTo(bx + 1.0, by); g.strokeStyle = P.ink; g.lineWidth = 0.3; g.stroke();
    g.beginPath(); g.moveTo(bx - 1.3, by); g.lineTo(bx + 1.3, by); g.lineTo(bx + 1.0, by + 2.3); g.lineTo(bx - 1.0, by + 2.3); g.closePath();
    g.fillStyle = P.woodHi; g.fill(); g.strokeStyle = P.ink; g.lineWidth = 0.4; g.stroke();
    g.beginPath(); g.moveTo(bx - 1.2, by + 0.9); g.lineTo(bx + 1.2, by + 0.9); g.strokeStyle = P.ink; g.lineWidth = 0.3; g.stroke();

    const L = K.wlen, t = [x + ca * L, y + sa * L];
    g.beginPath(); g.moveTo(x, y); g.lineTo(t[0], t[1]); g.strokeStyle = P.ink; g.lineWidth = 0.9; g.stroke();
    g.beginPath(); g.moveTo(x + ca * 0.8, y + sa * 0.8); g.lineTo(t[0], t[1]); g.strokeStyle = P.paperHi; g.lineWidth = 0.3; g.stroke();
  }
}

function drawBow(g, K, bowHand, drawHand, p, mx, my) {
  const L = K.wlen * 0.5;
  // bow is held by the front hand; limbs bend back toward the archer
  const a = p.wa, ca = Math.cos(a), sa = Math.sin(a);
  const top = [bowHand[0] + ca * L, bowHand[1] + sa * L], bot = [bowHand[0] - ca * L, bowHand[1] - sa * L];
  const bend = 2.0 + p.draw * 1.3;
  const n = [sa, -ca]; // points forward (away from the archer) when wa ~ -90deg
  const ctl = [bowHand[0] + n[0] * bend * 1.25, bowHand[1] + n[1] * bend * 1.25];
  g.beginPath(); g.moveTo(top[0], top[1]); g.quadraticCurveTo(ctl[0], ctl[1], bot[0], bot[1]);
  g.strokeStyle = P.ink; g.lineWidth = 0.95; g.stroke();
  g.beginPath(); g.moveTo(top[0] + mx, top[1] + my); g.quadraticCurveTo(ctl[0] + mx, ctl[1] + my, bot[0] + mx, bot[1] + my); g.strokeStyle = P.woodHi; g.lineWidth = 0.35; g.stroke();
  // string
  g.beginPath(); g.moveTo(top[0], top[1]);
  if (p.draw > 0.2) g.lineTo(drawHand[0], drawHand[1]);
  g.lineTo(bot[0], bot[1]);
  g.strokeStyle = hexA(P.ink, 0.85); g.lineWidth = 0.28; g.stroke();
  if (p.arrow) {
    const s = p.draw > 0.2 ? drawHand : [bowHand[0] - 1.6, bowHand[1]];
    const e = [bowHand[0] + 2.4, bowHand[1] - 0.15];
    g.beginPath(); g.moveTo(s[0], s[1]); g.lineTo(e[0], e[1]); g.strokeStyle = P.ink; g.lineWidth = 0.4; g.stroke();
    g.beginPath(); g.moveTo(e[0] + 0.9, e[1]); g.lineTo(e[0] - 0.2, e[1] - 0.5); g.lineTo(e[0] - 0.2, e[1] + 0.5); g.closePath(); g.fillStyle = P.ink; g.fill();
  }
}

function drawShield(g, K, hand, p, mx, my, anim) {
  const [x, y] = hand;
  g.save(); g.translate(x + 0.3, y + 0.4); g.rotate(p.lean * 0.5 + (anim === 'dead' ? 0.4 : 0));
  if (K.shield === 'kite') {
    const path = () => { g.beginPath(); g.moveTo(-2.2, -3.0); g.quadraticCurveTo(0, -3.7, 2.2, -3.0); g.quadraticCurveTo(2.4, 1.6, 0, 5.0); g.quadraticCurveTo(-2.4, 1.6, -2.2, -3.0); g.closePath(); };
    g.save(); g.translate(mx, my); path(); g.fillStyle = P.paperHi; g.fill();
    g.save(); path(); g.clip(); g.beginPath(); g.moveTo(-3, 1.3); g.lineTo(0, -1.4); g.lineTo(3, 1.3); g.lineTo(3, 3.0); g.lineTo(0, 0.4); g.lineTo(-3, 3.0); g.closePath(); g.fillStyle = P.indigo; g.fill(); g.restore();
    g.restore();
    path(); g.strokeStyle = P.ink; g.lineWidth = OL * 2.3; g.stroke();
  } else {
    const path = () => { g.beginPath(); g.moveTo(-2.1, -2.6); g.lineTo(2.1, -2.6); g.quadraticCurveTo(2.3, 1.2, 0, 3.6); g.quadraticCurveTo(-2.3, 1.2, -2.1, -2.6); g.closePath(); };
    g.save(); g.translate(mx, my); path(); g.fillStyle = P.rust; g.fill();
    g.beginPath(); g.arc(0, -0.3, 1.05, 0, 7); g.fillStyle = P.gold; g.fill();
    for (let i = 0; i < 8; i++) { const a = (i / 8) * 6.283; g.beginPath(); g.moveTo(Math.cos(a) * 1.25, -0.3 + Math.sin(a) * 1.25); g.lineTo(Math.cos(a) * 1.75, -0.3 + Math.sin(a) * 1.75); g.strokeStyle = P.gold; g.lineWidth = 0.35; g.stroke(); }
    g.restore();
    path(); g.strokeStyle = P.ink; g.lineWidth = OL * 2.3; g.stroke();
  }
  g.restore();
}

function drawLadderCarry(g, sh, mx, my) {
  const y = sh[1] - 3.1;
  g.lineCap = 'butt';
  for (const yy of [y, y + 1.5]) { g.beginPath(); g.moveTo(-8, yy); g.lineTo(9, yy - 0.4); g.strokeStyle = P.ink; g.lineWidth = 0.85; g.stroke(); g.beginPath(); g.moveTo(-8 + mx, yy + my); g.lineTo(9 + mx, yy - 0.4 + my); g.strokeStyle = P.woodHi; g.lineWidth = 0.32; g.stroke(); }
  for (let x = -7; x <= 8; x += 2.4) { g.beginPath(); g.moveTo(x, y - 0.1); g.lineTo(x, y + 1.5); g.strokeStyle = P.ink; g.lineWidth = 0.45; g.stroke(); }

// ---------------------------------------------------------------------------
// Woodcut light pass on a finished cell: warm rim inside the lit (west, upper) edge,
// ink shade inside the east/lower edge. Same rule for every frame of every kind, so the
// light can never disagree between sprites (anti-generic checklist #7).
const _lp = { a: null, b: null };
function lightPass(c, s, rimA = 0.85, shadeA = 0.32) {
  const w = c.width, h = c.height;
  if (!_lp.a || _lp.a.width < w || _lp.a.height < h) { _lp.a = mkCanvas(w, h); _lp.b = mkCanvas(w, h); }
  const A = _lp.a.getContext('2d'), Bc = _lp.b.getContext('2d');
  const o1 = Math.max(1, Math.round(0.55 * s)), o2 = o1 + Math.max(1, Math.round(0.6 * s)), o3 = o1 + Math.max(1, Math.round(0.85 * s));
  // shade band (lower-right)
  Bc.clearRect(0, 0, w, h); Bc.globalCompositeOperation = 'source-over'; Bc.drawImage(c, 0, 0);
  Bc.globalCompositeOperation = 'destination-in'; Bc.drawImage(c, -o1, -Math.round(o1 * 0.6));
  Bc.globalCompositeOperation = 'destination-out'; Bc.drawImage(c, -o3, -Math.round(o3 * 0.6));
  Bc.globalCompositeOperation = 'source-in'; Bc.fillStyle = P.ink; Bc.fillRect(0, 0, w, h);
  // rim band (upper-left)
  A.clearRect(0, 0, w, h); A.globalCompositeOperation = 'source-over'; A.drawImage(c, 0, 0);
  A.globalCompositeOperation = 'destination-in'; A.drawImage(c, o1, Math.round(o1 * 0.6));
  A.globalCompositeOperation = 'destination-out'; A.drawImage(c, o2, Math.round(o2 * 0.6));
  A.globalCompositeOperation = 'source-in'; A.fillStyle = '#F7E6BF'; A.fillRect(0, 0, w, h);
  const g = c.getContext('2d');
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalAlpha = shadeA; g.drawImage(_lp.b, 0, 0, w, h, 0, 0, w, h);
  g.globalAlpha = rimA; g.drawImage(_lp.a, 0, 0, w, h, 0, 0, w, h);
  g.restore();
  A.globalCompositeOperation = 'source-over'; Bc.globalCompositeOperation = 'source-over';
}

// ---------------------------------------------------------------------------
// Atlas: lazily generated frames packed into pages. key -> {img, sx, sy, sw, sh, ax, ay}
class Atlas {
  constructor(scale, cellW, cellH, ax, ay) {
    this.s = scale; this.cw = Math.ceil(cellW * scale); this.ch = Math.ceil(cellH * scale);
    this.ax = ax * scale; this.ay = ay * scale; this.cellW = cellW; this.cellH = cellH; this.axw = ax; this.ayw = ay;
    this.pages = []; this.map = new Map(); this.col = 0; this.row = 0; this.perRow = Math.floor(ATLAS_PAGE / this.cw); this.rows = Math.floor(ATLAS_PAGE / this.ch);
    this.tmp = mkCanvas(this.cw, this.ch); this.generated = 0; this.genMs = 0;
  }
  // after the loading-time print run, pages become immutable ImageBitmaps (cheaper to blit on every browser)
  async freeze() {
    if (typeof createImageBitmap !== 'function') return;
    const bm = await Promise.all(this.pages.map((p) => createImageBitmap(p)));
    for (const r of this.map.values()) { const i = this.pages.indexOf(r.img); if (i >= 0) r.img = bm[i]; }
    this.pages = this.pages.map(() => null); this.row = this.rows; // new frames start a fresh page
  }
  slot() {
    if (!this.pages.length || this.row >= this.rows) { const c = mkCanvas(this.perRow * this.cw, this.rows * this.ch); this.pages.push(c); this.col = 0; this.row = 0; }
    const page = this.pages[this.pages.length - 1];
    const r = { img: page, sx: this.col * this.cw, sy: this.row * this.ch, sw: this.cw, sh: this.ch, ax: this.ax, ay: this.ay };
    if (++this.col >= this.perRow) { this.col = 0; this.row++; }
    return r;
  }
  get(key, drawFn, post) {
    let r = this.map.get(key);
    if (r) return r;
    const t0 = performance.now();
    const c = this.tmp, g = c.getContext('2d');
    g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, c.width, c.height);
    g.setTransform(this.s, 0, 0, this.s, this.ax, this.ay);
    drawFn(g);
    lightPass(c, this.s);
    if (post) { g.setTransform(1, 0, 0, 1, 0, 0); post(c, g); }
    r = this.slot();
    const pg = r.img.getContext('2d'); pg.drawImage(c, r.sx, r.sy);
    this.map.set(key, r); this.generated++; this.genMs += performance.now() - t0;
    return r;
  }
}

let ATLAS = null, BIG = null;
const ATLAS_PAGE = +(new URLSearchParams(location.search).get("page") || 1024);
const ANIM_IDX = { idle: 0, walk: 1, attack: 2, hit: 3, die: 4, dead: 5, climb: 6 };
function unitFrame(k, v, anim, f, dir) {
  const key = k * 100000 + v * 10000 + ANIM_IDX[anim] * 1000 + f * 10 + (dir > 0 ? 1 : 0);
  const hit = ATLAS.map.get(key); if (hit) return hit; // hot path: no closures
  return ATLAS.get(key, (g) => drawFigure(g, KINDS[k], v, anim, f, dir), (c, g) => { if (anim === 'hit') flashPost(c, g); if (anim !== 'climb') shadowPost(c, g, k); });
}
// the contact shadow is printed into the plate itself (behind the figure): one blit per soldier, not two
function shadowPost(c, g, k) {
  const A = ATLAS, L = KINDS[k].body === 'goblin' ? 5 : 8;
  g.setTransform(A.s, 0, 0, A.s, A.ax, A.ay);
  g.globalCompositeOperation = 'destination-over'; g.fillStyle = 'rgba(38,40,58,0.24)';
  g.beginPath(); g.ellipse(L * 0.42, -0.2, L * 0.62, 1.35, -0.27, 0, 7); g.fill();
  g.globalCompositeOperation = 'source-over'; g.setTransform(1, 0, 0, 1, 0, 0);
}
// The dead keep only their ink: pigment drains out of a fallen body; the blood stays red.
const _ink = { c: null };
function inkPost(c, g) {
  if (!_ink.c || _ink.c.width !== c.width || _ink.c.height !== c.height) _ink.c = mkCanvas(c.width, c.height);
  const k = _ink.c.getContext('2d'); k.clearRect(0, 0, c.width, c.height); k.drawImage(c, 0, 0);
  g.globalCompositeOperation = 'saturation'; g.fillStyle = '#808080'; g.fillRect(0, 0, c.width, c.height);
  g.globalCompositeOperation = 'source-atop'; g.fillStyle = 'rgba(214,206,190,0.38)'; g.fillRect(0, 0, c.width, c.height);
  g.globalCompositeOperation = 'destination-in'; g.drawImage(_ink.c, 0, 0);
  g.globalCompositeOperation = 'source-over';
}
// a hit frame is printed lighter: the paper shows through for a beat (1–2 frames of flash)
function flashPost(c, g) {
  g.globalCompositeOperation = 'source-atop'; g.fillStyle = 'rgba(250,240,220,0.42)'; g.fillRect(0, 0, c.width, c.height);
  g.globalCompositeOperation = 'source-over';
}
function corpseFrame(k, v, pose, dir) {
  const key = -1 - (k * 100000 + v * 10000 + pose * 10 + (dir > 0 ? 1 : 0));
  const hit = ATLAS.map.get(key); if (hit) return hit;
  return ATLAS.get(key, (g) => drawFigure(g, KINDS[k], v, 'dead', pose, dir), inkPost);
}

// Big things: the orc log ram (part rig: shed + swinging log), ladders, banners
function drawRamShed(g, state) {
  const wreck = state === 'wreck';
  g.lineCap = 'round'; g.lineJoin = 'round';
  const mx = MIS[0], my = MIS[1];
  // wheels
  for (const wx of [-12, 10]) {
    const cx = wx, cy = -3.8, r = wreck && wx > 0 ? 3.0 : 3.8;
    g.save(); g.translate(mx, my); g.beginPath(); g.arc(cx, cy, r, 0, 7); g.fillStyle = P.wood; g.fill(); g.restore();
    g.beginPath(); g.arc(cx, cy, r, 0, 7); g.strokeStyle = P.ink; g.lineWidth = 1.0; g.stroke();
    for (let i = 0; i < 6; i++) { const a = i * 1.047 + (wx > 0 ? 0.3 : 0); g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); g.strokeStyle = P.ink; g.lineWidth = 0.45; g.stroke(); }
    g.beginPath(); g.arc(cx, cy, 0.9, 0, 7); g.fillStyle = P.ink; g.fill();
  }
  // base beam
  g.beginPath(); g.moveTo(-20, -6); g.lineTo(20, -6); g.strokeStyle = P.ink; g.lineWidth = 2.2; g.stroke();
  g.beginPath(); g.moveTo(-20 + mx, -6 + my); g.lineTo(20 + mx, -6 + my); g.strokeStyle = P.woodLo; g.lineWidth = 1.0; g.stroke();
  // roof of hides
  const roof = wreck
    ? [[-21, -6], [-15, -14], [2, -11], [9, -16], [19, -6]]
    : [[-21, -6], [-16.5, -19.5], [15, -19.5], [20.5, -6]];
  const rp = () => poly(g, roof);
  g.save(); g.translate(mx, my); rp(); g.fillStyle = wreck ? P.ink2 : P.leather; g.fill(); g.restore();
  g.save(); rp(); g.clip();
  // hide patches + stitches
  const patches = [[-19, -17, 12, 11, P.rust], [-6, -19, 11, 9, P.fur], [4, -18, 14, 12, P.rustLo], [-12, -11, 13, 6, P.wood]];
  for (const [x, y, w, h, c] of patches) {
    g.fillStyle = wreck ? mix(c, P.ink, 0.6) : c; g.fillRect(x, y, w, h);
    g.beginPath(); for (let i = 0; i < w; i += 1.6) { g.moveTo(x + i, y - 0.5); g.lineTo(x + i + 0.7, y + 0.6); } g.strokeStyle = P.ink; g.lineWidth = 0.3; g.stroke();
  }
  hatch(g, -22, -10, 22, -5, -0.5, 1.1, 0.35, P.ink, 0.55, 3);
  if (!wreck) { // a red hand: the horde's mark
    g.fillStyle = P.cinnabar; g.beginPath(); g.ellipse(0, -13.2, 1.5, 1.8, 0, 0, 7); g.fill();
    for (let i = 0; i < 4; i++) { g.fillRect(-1.6 + i * 0.95, -16.6, 0.55, 2.2); }
  }
  g.restore();
  rp(); g.strokeStyle = P.ink; g.lineWidth = 1.0; g.stroke();
  if (!wreck) {
    // bone skull on the ridge
    g.beginPath(); g.arc(13.5, -21.2, 1.7, 0, 7); g.fillStyle = P.bone; g.fill(); g.strokeStyle = P.ink; g.lineWidth = 0.5; g.stroke();
    g.fillStyle = P.ink; g.fillRect(13.6, -21.6, 0.6, 0.6); g.fillRect(14.4, -21.6, 0.6, 0.6);
    g.beginPath(); g.moveTo(-17, -19.5); g.quadraticCurveTo(-19, -23, -16.5, -25); g.strokeStyle = P.bone; g.lineWidth = 0.9; g.stroke();
  } else {
    // charred broken rafters
    g.beginPath(); g.moveTo(-8, -12); g.lineTo(-3, -21); g.moveTo(5, -13); g.lineTo(12, -22); g.strokeStyle = P.ink; g.lineWidth = 1.2; g.stroke();
  }
}
function drawRamLog(g) {
  const mx = MIS[0], my = MIS[1];
  g.save(); g.translate(mx, my); g.beginPath(); g.roundRect(-14, -11.6, 34, 3.6, 1.6); g.fillStyle = P.wood; g.fill(); g.restore();
  g.beginPath(); g.roundRect(-14, -11.6, 34, 3.6, 1.6); g.strokeStyle = P.ink; g.lineWidth = 0.8; g.stroke();

// Banners: a pole + a flag in 3 wave frames. Emblems are drawn from a fixed rule per squad
// (anti-generic #9: the same heraldry everywhere it appears: field, card, chronicle).
const EMBLEMS = {
  hawk: { field: P.indigo, charge: P.paperHi, name: '회색매' },
  chevron: { field: P.paperHi, charge: P.indigo, name: '브란' },
  reed: { field: P.indigo, charge: P.paperHi, name: '갈대피리' },
  wheel: { field: P.paperHi, charge: P.indigoLo, name: '물레' },
  sun: { field: P.rust, charge: P.gold, name: '협약' },
  hand: { field: P.bone, charge: P.cinnabar, name: '군단' },

function drawEmblem(g, kind, w, h) {
  const E = EMBLEMS[kind];
  g.fillStyle = E.field; g.fillRect(0, 0, w, h);
  g.fillStyle = E.charge; g.strokeStyle = E.charge;
  const cx = w / 2, cy = h / 2, u = Math.min(w, h);
  g.lineCap = 'round'; g.lineJoin = 'round';
  if (kind === 'hawk') {
    g.beginPath(); g.moveTo(cx - u * 0.42, cy - u * 0.1); g.quadraticCurveTo(cx - u * 0.18, cy - u * 0.05, cx, cy + u * 0.22); g.quadraticCurveTo(cx + u * 0.18, cy - u * 0.05, cx + u * 0.42, cy - u * 0.1); g.quadraticCurveTo(cx + u * 0.2, cy + u * 0.12, cx + u * 0.05, cy + u * 0.32); g.lineTo(cx - u * 0.05, cy + u * 0.32); g.quadraticCurveTo(cx - u * 0.2, cy + u * 0.12, cx - u * 0.42, cy - u * 0.1); g.fill();
    g.beginPath(); g.arc(cx, cy - u * 0.07, u * 0.07, 0, 7); g.fill();
  } else if (kind === 'chevron') {
    g.beginPath(); g.moveTo(0, cy + u * 0.32); g.lineTo(cx, cy - u * 0.18); g.lineTo(w, cy + u * 0.32); g.lineTo(w, cy + u * 0.55); g.lineTo(cx, cy + u * 0.05); g.lineTo(0, cy + u * 0.55); g.closePath(); g.fill();
    g.fillStyle = P.cinnabar; g.beginPath(); g.arc(cx, cy - u * 0.32, u * 0.08, 0, 7); g.fill();
  } else if (kind === 'reed') {
    g.fillStyle = P.paperHi; g.fillRect(cx, 0, w / 2, h);
    g.lineWidth = u * 0.07; g.strokeStyle = P.paperHi; g.beginPath(); g.moveTo(cx - u * 0.18, h); g.quadraticCurveTo(cx - u * 0.2, cy, cx - u * 0.05, u * 0.12); g.stroke();
    g.strokeStyle = P.indigo; g.beginPath(); g.moveTo(cx + u * 0.18, h); g.quadraticCurveTo(cx + u * 0.22, cy, cx + u * 0.08, u * 0.12); g.stroke();
  } else if (kind === 'wheel') {
    g.lineWidth = u * 0.07; g.beginPath(); g.arc(cx, cy, u * 0.3, 0, 7); g.stroke();
    for (let i = 0; i < 6; i++) { const a = i * 1.047; g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx + Math.cos(a) * u * 0.3, cy + Math.sin(a) * u * 0.3); g.stroke(); }
  } else if (kind === 'sun') {
    g.beginPath(); g.arc(cx, cy, u * 0.2, 0, 7); g.fill();
    g.lineWidth = u * 0.06; for (let i = 0; i < 12; i++) { const a = i * 0.5236; g.beginPath(); g.moveTo(cx + Math.cos(a) * u * 0.26, cy + Math.sin(a) * u * 0.26); g.lineTo(cx + Math.cos(a) * u * 0.4, cy + Math.sin(a) * u * 0.4); g.stroke(); }
  } else if (kind === 'hand') {
    g.beginPath(); g.ellipse(cx, cy + u * 0.1, u * 0.18, u * 0.2, 0, 0, 7); g.fill();
    for (let i = 0; i < 4; i++) g.fillRect(cx - u * 0.2 + i * u * 0.11, cy - u * 0.32, u * 0.07, u * 0.3);
    g.beginPath(); g.ellipse(cx + u * 0.22, cy, u * 0.06, u * 0.15, -0.6, 0, 7); g.fill();

}
function drawBanner(g, emblem, frame, sag) {
  // pole
  g.lineCap = 'round';
  g.beginPath(); g.moveTo(0, 0); g.lineTo(0, -24); g.strokeStyle = P.ink; g.lineWidth = 1.0; g.stroke();
  g.beginPath(); g.moveTo(0, -24); g.lineTo(0, -25.6); g.strokeStyle = P.gold; g.lineWidth = 1.1; g.stroke();
  const w = 10, h = 6.4, ph = frame * 2.1;
  // flag as a waving quad; drawn through a clip of the flag shape
  const top = (t) => -23 + sag * t * 2 + Math.sin(ph + t * 3.2) * 0.8 * t;
  const bot = (t) => -23 + h + sag * t * 2.6 + Math.sin(ph + t * 3.2 + 0.4) * 0.8 * t;
  const shape = () => { g.beginPath(); g.moveTo(0.5, top(0)); for (let i = 1; i <= 8; i++) { const t = i / 8; g.lineTo(0.5 + w * t, top(t)); } g.lineTo(0.5 + w - 1.6, (top(1) + bot(1)) / 2); g.lineTo(0.5 + w, bot(1)); for (let i = 8; i >= 0; i--) { const t = i / 8; g.lineTo(0.5 + w * t, bot(t)); } g.closePath(); };
  g.save(); g.translate(MIS[0], MIS[1]); shape(); g.clip();
  g.translate(0.5, -23 + sag); drawEmblem(g, emblem, w, h + sag * 2.6);
  g.restore();

  for (let i = 0; i < 3; i++) { const t = 0.25 + i * 0.3; const x = 0.5 + w * t; g.beginPath(); g.moveTo(x, top(t)); g.lineTo(x + 0.4, bot(t)); g.strokeStyle = hexA(P.ink, Math.sin(ph + t * 3.2) > 0 ? 0.28 : 0.08); g.lineWidth = 1.4; g.stroke(); }

}

const WALLSTONE = mix(P.stone, P.stoneMid, 0.32);
// ============================================================================
// world: the printed page. Ground (paper + snow + road + courtyard + baked shadows)
// and structure sprites (wall rows, towers, gate states), all at device scale.
// ============================================================================
const PR = (x, y, z) => [x + HX * z, y - HY * z]; // project

// ---------- ground ----------
function bakeGround(R, S) {
  const c = mkCanvas(R.w * S, R.h * S);
  const g = c.getContext('2d');
  g.setTransform(S, 0, 0, S, -R.x * S, -R.y * S);
  const x0 = R.x, y0 = R.y, x1 = R.x + R.w, y1 = R.y + R.h;

  // 1. base paper/snow with soft low-frequency mottling (computed at 1/4 res, smoothed up)
  const nW = Math.ceil(R.w / 4), nH = Math.ceil(R.h / 4);
  const nc = mkCanvas(nW, nH), ng = nc.getContext('2d');
  const id = ng.createImageData(nW, nH);
  const base = [parseInt(P.snow.slice(1, 3), 16), parseInt(P.snow.slice(3, 5), 16), parseInt(P.snow.slice(5, 7), 16)];
  const court = [206, 200, 189];
  for (let j = 0; j < nH; j++) for (let i = 0; i < nW; i++) {
    const wx = x0 + i * 4, wy = y0 + j * 4;
    const n = fbm(wx / 70, wy / 55, 3, 4), m = fbm(wx / 18, wy / 14, 9, 3);
    const inside = wx > WX + WW;
    const b = inside ? court : base;
    const k = (n - 0.5) * 26 + (m - 0.5) * 9;
    const o = (j * nW + i) * 4;
    id.data[o] = b[0] + k; id.data[o + 1] = b[1] + k; id.data[o + 2] = b[2] + k * 0.8; id.data[o + 3] = 255;
  }
  ng.putImageData(id, 0, 0);
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
  g.drawImage(nc, x0, y0, nW * 4, nH * 4);

  const rr = RNG(911);
  // 2. wind-cut snow: woodcut gouges (sparse, clustered by noise) in the field
  g.lineCap = 'round';
  for (let i = 0; i < 1400; i++) {
    const x = rr.range(x0, Math.min(x1, WX - 4)), y = rr.range(y0, y1);
    const n = fbm(x / 60, y / 40, 21, 3);
    if (n < 0.5 || rr() > (n - 0.45) * 2.2) continue;
    const L = 3 + rr() * 9 * n, a = -0.22 + (rr() - 0.5) * 0.12;
    g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + L * 0.5, y + Math.sin(a) * L * 0.5 - 0.6, x + L, y + Math.sin(a) * L);
    g.strokeStyle = hexA(P.wash1, 0.16 + 0.14 * rr()); g.lineWidth = 0.35 + rr() * 0.35; g.stroke();
    g.beginPath(); g.moveTo(x + 0.4, y - 0.7); g.lineTo(x + L * 0.8, y - 0.7 + Math.sin(a) * L * 0.8);
    g.strokeStyle = hexA(P.paperHi, 0.5); g.lineWidth = 0.6; g.stroke();
  }

  // 2b. a frozen creek crossing the field (ice plates, ink cracks, reeds on the banks)
  const creek = []; for (let i = 0; i <= 30; i++) { const t = i / 30; creek.push([400 - t * 210 + Math.sin(t * 7) * 14, -12 + t * 460]); }
  brush(g, creek, () => 30, '#9EA6AE', 0.55);
  brush(g, creek, () => 22, '#C7CDD1', 0.9);
  for (let i = 0; i < 46; i++) { const k = rr.int(1, 29), p = creek[k], q = creek[k + 1]; const ox = rr.range(-8, 8); g.beginPath(); wobLine(g, p[0] + ox, p[1], q[0] + ox + rr.range(-4, 4), q[1], 1.2, i); g.strokeStyle = hexA(P.ink, 0.45); g.lineWidth = 0.35 + rr() * 0.3; g.stroke(); }
  for (let i = 0; i < 28; i++) { const k = rr.int(0, 29), p = creek[k]; inkBlob(g, p[0] + rr.range(-7, 7), p[1] + rr.range(-6, 6), 2 + rr() * 4, 600 + i, P.paperHi, 0.85, 0.5); }
  for (const side of [-1, 1]) { g.beginPath(); creek.forEach(([x, y], i) => { const xx = x + side * (14 + hash2(side + 5, i) * 2); i ? g.lineTo(xx, y) : g.moveTo(xx, y); }); g.strokeStyle = hexA(P.ink, 0.55); g.lineWidth = 0.8; g.stroke(); }
  for (let i = 0; i < 36; i++) { const k = rr.int(0, 30), p = creek[k], side = rr() < 0.5 ? -1 : 1; const bx = p[0] + side * rr.range(14, 20), by = p[1] + rr.range(-4, 4); for (let j = 0; j < 5; j++) { const L = rr.range(4, 8), a2 = -1.57 + rr.range(-0.4, 0.4); brush(g, qpts(bx + j * 0.7, by, bx + j * 0.7 + Math.cos(a2) * L * 0.5 + 0.7, by + Math.sin(a2) * L * 0.5, bx + j * 0.7 + Math.cos(a2) * L + 1.3, by + Math.sin(a2) * L), nib(0.55), P.ink2, 0.8); } }
  // paper fibres (world-fixed): the page is felt even under the snow
  for (let i = 0; i < (R.w * R.h) / 22; i++) { const x = rr.range(x0, x1), y = rr.range(y0, y1), a2 = rr() * 3.14, L = 0.8 + rr() * 2.6; g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a2) * L * 0.5 + 0.3, y + Math.sin(a2) * L * 0.5, x + Math.cos(a2) * L, y + Math.sin(a2) * L); g.strokeStyle = rr() < 0.55 ? 'rgba(110,92,64,0.09)' : 'rgba(255,252,244,0.35)'; g.lineWidth = 0.22 + rr() * 0.2; g.stroke(); }
  // 3. road: trampled slush from the west edge to the gate, with ruts
  const road = [];
  for (let i = 0; i <= 40; i++) { const t = i / 40; const x = x0 - 10 + (WX - (x0 - 10)) * t; road.push([x, GYC + Math.sin(t * 5.2 + 1) * 10 * (1 - t) + (fbm(t * 4, 2, 5, 2) - 0.5) * 10 * (1 - t)]); }
  for (let pass = 0; pass < 9; pass++) {
    const off = (pass - 4) * 2.6, w = 3 + rr() * 4;
    brush(g, road.map(([x, y], i) => [x, y + off + (hash2(pass, i) - 0.5) * 2]), () => w, pass % 3 ? P.wash2 : P.wash1, 0.09 + 0.05 * rr());
  }
  for (const off of [-4.5, 4.5]) {
    g.beginPath(); road.forEach(([x, y], i) => { const yy = y + off + (hash2(77 + off, i) - 0.5) * 0.8; i ? g.lineTo(x, yy) : g.moveTo(x, yy); });
    g.strokeStyle = hexA(P.ink2, 0.35); g.lineWidth = 0.9; g.stroke();
  }
  // footprints along the road (older traffic)
  for (let i = 0; i < 700; i++) {
    const t = rr(), k = Math.min(39, Math.floor(t * 40)), p = road[k];
    const x = p[0] + rr.range(-2, 2), y = p[1] + rr.range(-12, 12);
    g.fillStyle = hexA(P.ink2, 0.12 + rr() * 0.12); g.beginPath(); g.ellipse(x, y, 0.9, 0.45, -0.2, 0, 7); g.fill();
  }

  g.save();
  g.beginPath(); g.rect(WX + WW, y0, x1 - WX - WW, R.h); g.clip();
  const fs = RNG(5);
  // a cobble apron just inside the gate (small irregular setts, half buried in snow)
  for (let i = 0; i < 520; i++) {
    const ang = fs.range(-1.25, 1.25), d = Math.sqrt(fs()) * 58;
    const x = WX + WW + 2 + Math.cos(ang) * d * 1.15, y = GYC + Math.sin(ang) * d * 0.95;
    const cov = fbm(x / 14, y / 14, 33, 3);
    if (cov > 0.6 - (1 - d / 58) * 0.25) continue;
    const r0 = 1.3 + fs() * 1.1, rot0 = fs() * 0.6 - 0.3;
    g.globalAlpha = 0.85 - d / 110;
    g.beginPath(); g.ellipse(x, y, r0, r0 * 0.68, rot0, 0, 7); g.fillStyle = mix(P.stone, P.stoneMid, 0.3 + fs() * 0.6); g.fill();
    g.beginPath(); g.ellipse(x, y, r0, r0 * 0.68, rot0, -0.2, 2.2); g.strokeStyle = P.ink2; g.lineWidth = 0.45; g.stroke();
    g.beginPath(); g.ellipse(x - r0 * 0.2, y - r0 * 0.15, r0 * 0.55, r0 * 0.3, rot0, 3.3, 4.6); g.strokeStyle = P.paperHi; g.lineWidth = 0.4; g.stroke();
    g.globalAlpha = 1;
  }
  // mud lanes from the gate into the courtyard (carts, boots)
  for (let pass = 0; pass < 6; pass++) {
    const pts = []; for (let i = 0; i <= 20; i++) { const t = i / 20; pts.push([WX + WW + t * 330, GYC + Math.sin(t * 3 + pass) * 6 + (pass - 3) * 3 - t * t * 70 * (pass % 2 ? 1 : -0.6)]); }
    brush(g, pts, () => 4 + pass, P.wash1, 0.07);
  }
  // trampled paths: gate→keep door, well→infirmary, depot→north stair, gate→infirmary (stretchers)
  const MUD = '#7A6A52';

    const P2 = []; for (let i = 0; i < pts.length - 1; i++) for (let k = 0; k < 10; k++) { const t = k / 10; P2.push([pts[i][0] + (pts[i + 1][0] - pts[i][0]) * t, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * t]); } P2.push(pts[pts.length - 1]);

  };

  trail([[762, 246], [776, 282], [788, 314]], 6, 102);
  trail([[724, 140], [640, 132], [556, 124]], 6, 103);
  trail([[600, GYC + 20], [668, 262], [718, 292], [774, 330]], 7, 104);
  // a frozen puddle by the well, catching the last light
  { const x = 742, y = 262; g.beginPath(); g.ellipse(x, y, 9, 3, -0.1, 0, 7); g.fillStyle = '#C9D3DC'; g.fill(); g.strokeStyle = hexA(P.ink2, 0.6); g.lineWidth = 0.5; g.stroke(); g.beginPath(); g.moveTo(x - 5, y - 1); g.lineTo(x + 2, y - 1.6); g.strokeStyle = P.paperHi; g.lineWidth = 0.6; g.stroke(); }
  // straw
  for (let i = 0; i < 420; i++) {
    const x = fs.range(WX + WW + 10, 900), y = fs.range(60, 400), a = fs() * 3.14;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * 2.4, y + Math.sin(a) * 2.4); g.strokeStyle = hexA(P.gold, 0.35); g.lineWidth = 0.35; g.stroke();
  }
  g.restore();

  // 5. dead reeds and grass tufts in the field (brush flicks), pines at the margins
  for (let i = 0; i < 60; i++) {
    const x = rr.range(x0 + 10, WX - 60), y = rr.range(y0 + 10, y1 - 10);
    if (Math.abs(y - GYC) < 26) continue;
    const n = rr.int(4, 9);

      const bx = x + rr.range(-3, 3), by = y + rr.range(-1, 1), L = rr.range(4, 9), a = -Math.PI / 2 + rr.range(-0.5, 0.4) + 0.15;

  for (let i = 0; i < 70; i++) { const t = rr(); const x = rr.range(-10, 250) * (0.4 + 0.6 * t), y = rr.range(-6, 30 + 70 * (1 - x / 250)); forest.push([x, y, 0.75 + rr() * 0.6]); }
  for (let i = 0; i < 55; i++) { const x = rr.range(-10, 230), y = 440 - rr.range(0, 36 + 60 * (1 - x / 230)); forest.push([x, y, 0.7 + rr() * 0.6]); }
  for (let i = 0; i < 6; i++) forest.push([rr.range(120, 330), rr.range(60, 380), 0.6 + rr() * 0.3]);
  forest.sort((a2, b2) => a2[1] - b2[1]);
  for (const [tx, ty, sc] of forest) pine(g, tx, ty, sc, rr);
  // a few stones
  for (let i = 0; i < 14; i++) {
    const x = rr.range(x0 + 20, WX - 30), y = rr.range(y0, y1); if (Math.abs(y - GYC) < 24) continue;
    const r = rr.range(1.5, 3.2);
    g.fillStyle = hexA(P.ink, 0.12); g.beginPath(); g.ellipse(x + r * 1.4, y + 0.3, r * 1.6, r * 0.5, -0.25, 0, 7); g.fill();
    inkBlob(g, x, y, r, 300 + i, P.stoneMid, 1, 0.7);
    g.beginPath(); g.ellipse(x, y, r, r * 0.7, 0, 0, 7); g.strokeStyle = P.ink; g.lineWidth = 0.5; g.stroke();
    g.beginPath(); g.arc(x - r * 0.2, y - r * 0.15, r * 0.6, 3.4, 4.6); g.strokeStyle = P.paperHi; g.lineWidth = 0.5; g.stroke();
  }

  // 6. baked structure shadows (sun low in the WSW: shadows run east, slightly north)
  const shadowPoly = (xa, ya, xb, yb, h) => { // footprint rect → swept shadow polygon
    const dx = SUN.dx * h, dy = SUN.dy * h;
    return [[xb, ya], [xb + dx, ya + dy], [xb + dx, yb + dy], [xb, yb]];
  };
  const shades = [];
  for (const [a, b] of WALLSEG) shades.push(shadowPoly(WX, a, WX + WW, b, WH + 4));
  for (const T of TOWERS) shades.push(shadowPoly(T.x0, T.y0, T.x1, T.y1, T.h + (T.roof ? 12 : 4)));
  for (const B of WARD) shades.push(shadowPoly(B.x0, B.y0, B.x1, B.y1, B.h + (B.roof || 0) * 0.6));
  g.save();
  g.beginPath(); for (const s of shades) { g.moveTo(s[0][0], s[0][1]); for (let i = 1; i < 4; i++) g.lineTo(s[i][0], s[i][1]); g.closePath(); }

  g.fillStyle = hexA('#2E3550', 0.3); g.fillRect(WX, y0, x1 - WX, R.h);
  hatch(g, WX, y0, x1, y1, 1.05, 1.7, 0.42, P.ink, 0.42, 41);
  g.restore();

  // 7. courtyard props (static, low; their shadows too)
  props(g, rr);
  return c;
}

// ---------- structures: wall rows, towers, gate (sprites with world anchors) ----------
function structSprite(S, wx0, wy0, ww, wh, drawFn) {
  const c = mkCanvas(ww * S, wh * S), g = c.getContext('2d');
  g.setTransform(S, 0, 0, S, -wx0 * S, -wy0 * S);
  g.lineJoin = 'round'; g.lineCap = 'round';
  drawFn(g);
  return { img: c, x: wx0, y: wy0, w: ww, h: wh };
}

function faceStones(g, xa, ya, yb, z0, z1, lit, seed) {
  // west-facing face: courses at fixed z (vertical on screen), joints diagonal
  const pts = [PR(xa, ya, z0), PR(xa, yb, z0), PR(xa, yb, z1), PR(xa, ya, z1)];
  poly(g, pts); g.fillStyle = lit; g.fill();
  g.save(); poly(g, pts); g.clip();
  let row = 0;
  for (let z = z0; z < z1; z += 4.2, row++) {
    const zz = Math.min(z1, z + 4.2);
    // tinted stones
    let y = ya - ((row * 5.3) % 7);
    while (y < yb) {
      const L = 5 + hash2(seed + row, Math.floor(y)) * 6;
      const t = hash2(seed - row, Math.floor(y) + 3);
      if (t > 0.62) { poly(g, [PR(xa, y, z), PR(xa, y + L, z), PR(xa, y + L, zz), PR(xa, y, zz)]); g.fillStyle = hexA(t > 0.85 ? P.stoneLo : P.stoneMid, 0.45); g.fill(); }
      const a = PR(xa, y, z), b = PR(xa, y, zz);
      g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.strokeStyle = hexA(P.ink, 0.55); g.lineWidth = 0.45; g.stroke();
      y += L;
    }
    const a = PR(xa, ya, z), b = PR(xa, yb, z);
    g.beginPath(); wobLine(g, a[0], a[1], b[0], b[1], 0.25, seed + row); g.strokeStyle = hexA(P.ink, 0.6); g.lineWidth = 0.5; g.stroke();
  }
  // grime + snow at the foot
  const gA = PR(xa, ya, 0), gB = PR(xa, yb, 0);
  g.fillStyle = hexA(P.ink, 0.12); poly(g, [gA, gB, PR(xa, yb, 7), PR(xa, ya, 7)]); g.fill();
  g.restore();
}
function shadeFaceS(g, xa, xb, y, z0, z1) { // south face (in shade): hatched
  const pts = [PR(xa, y, z0), PR(xb, y, z0), PR(xb, y, z1), PR(xa, y, z1)];
  poly(g, pts); g.fillStyle = P.stoneLo; g.fill();
  g.save(); poly(g, pts); g.clip(); const bb = [Math.min(pts[0][0], pts[3][0]) - 2, pts[3][1] - 2, Math.max(pts[1][0], pts[2][0]) + 2, pts[0][1] + 2];
  hatch(g, bb[0], bb[1], bb[2], bb[3], 0.95, 1.25, 0.42, P.ink, 0.7, Math.floor(xa + y)); g.restore();
  poly(g, pts); g.strokeStyle = P.ink; g.lineWidth = 0.6; g.stroke();
}
function topFace(g, xa, xb, ya, yb, z, col, snowSeed) {
  const pts = [PR(xa, ya, z), PR(xb, ya, z), PR(xb, yb, z), PR(xa, yb, z)];
  poly(g, pts); g.fillStyle = col; g.fill();
  if (snowSeed) { g.save(); poly(g, pts); g.clip(); for (let y = ya; y < yb; y += 3) { const s = hash2(snowSeed, Math.floor(y)); if (s > 0.45) { const p = PR(xa + s * (xb - xa) * 0.6, y, z); inkBlob(g, p[0] + 2, p[1], 1.6 + s * 2, snowSeed + y, P.paperHi, 0.9, 0.6); } } g.restore(); }
  poly(g, pts); g.strokeStyle = P.ink; g.lineWidth = 0.6; g.stroke();
}
function merlon(g, x, ya, yb, z, h, d) {
  // west face lit, top with a snow cap, south face shaded
  const xa = x, xb = x + d;
  faceStonesSimple(g, xa, ya, yb, z, z + h);
  shadeFaceS(g, xa, xb, yb, z, z + h);
  const t = [PR(xa, ya, z + h), PR(xb, ya, z + h), PR(xb, yb, z + h), PR(xa, yb, z + h)];
  poly(g, t); g.fillStyle = P.paperHi; g.fill(); g.strokeStyle = P.ink; g.lineWidth = 0.55; g.stroke();
}
function faceStonesSimple(g, xa, ya, yb, z0, z1) {
  const pts = [PR(xa, ya, z0), PR(xa, yb, z0), PR(xa, yb, z1), PR(xa, ya, z1)];
  poly(g, pts); g.fillStyle = P.stone; g.fill(); g.strokeStyle = P.ink; g.lineWidth = 0.55; g.stroke();
}

function wallRow(S, ya, yb, seg, idx) {
  const zTop = WH, pad = 3;
  const x0 = WX - pad, y0 = ya - HY * (WH + 7) - pad;
  const w = WW + HX * (WH + 7) + pad * 2 + 2, h = yb - ya + HY * (WH + 7) + pad * 2;
  return structSprite(S, x0, y0, w, h, (g) => {
    // west face: a touch darker than the snow, stained by melt-water, with a corbel band under the parapet
    faceStones(g, WX, ya, yb, 0, zTop, WALLSTONE, 100 + idx);
    { const band = [PR(WX, ya, zTop - 3.2), PR(WX, yb, zTop - 3.2), PR(WX, yb, zTop), PR(WX, ya, zTop)]; poly(g, band); g.fillStyle = hexA(P.ink, 0.62); g.fill();
      for (let y = Math.ceil(ya / 3) * 3; y < yb - 0.5; y += 3) { const q = [PR(WX - 0.01, y, zTop - 2.6), PR(WX - 0.01, y + 1.4, zTop - 2.6), PR(WX - 0.01, y + 1.4, zTop - 0.4), PR(WX - 0.01, y, zTop - 0.4)]; poly(g, q); g.fillStyle = P.stoneMid; g.fill(); }
      for (let y = ya + 1; y < yb; y += 2.3) { const k = hash2(idx * 7, Math.floor(y * 3)); if (k < 0.55) continue; const p0 = PR(WX, y, zTop - 3.4), p1 = PR(WX, y + 0.3, zTop - 3.4 - (4 + k * 12)); g.beginPath(); g.moveTo(p0[0], p0[1]); g.lineTo(p1[0], p1[1]); g.strokeStyle = hexA(P.ink2, 0.13 + k * 0.08); g.lineWidth = 0.7; g.stroke(); } }
    // walkway (top) with snow
    topFace(g, WX + 3, WX + WW, ya, yb, zTop, P.stoneMid, 500 + idx);
    // east parapet (low)
    topFace(g, WX + WW - 2, WX + WW, ya, yb, zTop + 2, P.stone, 0);
    // west parapet base strip + merlons every 8px (world y), crenels between
    topFace(g, WX, WX + 3, ya, yb, zTop + 1.5, P.stone, 0);
    const first = Math.ceil(ya / 8) * 8;
    for (let y = first - 8; y < yb; y += 8) {
      const a = Math.max(ya, y), b = Math.min(yb, y + 5);
      if (b - a > 0.5) merlon(g, WX, a, b, zTop + 1.5, 4.5, 3);
    }
    // seam line at the outer edge
    const a = PR(WX, ya, 0), b = PR(WX, yb, 0);
    g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.strokeStyle = P.ink; g.lineWidth = 1.3; g.stroke();
    const ta = PR(WX, ya, zTop + 1.5), tb = PR(WX, yb, zTop + 1.5);
    g.beginPath(); g.moveTo(ta[0], ta[1]); g.lineTo(tb[0], tb[1]); g.strokeStyle = P.ink; g.lineWidth = 1.0; g.stroke();
    // snow drift at the foot
    g.beginPath(); g.moveTo(a[0] - 3, a[1]); for (let y = ya; y <= yb; y += 2) g.lineTo(WX - 2 - 2.2 * hash2(idx, y), y); g.lineTo(b[0] + 0.5, b[1]); g.lineTo(a[0] + 0.5, a[1]); g.closePath(); g.fillStyle = P.paperHi; g.fill();
  });
}

function towerSprite(S, T, idx) {
  const top = T.h, roofH = T.roof ? 22 : 0;
  const x0 = T.x0 - 3, y0 = T.y0 - HY * (top + roofH + 8) - 4;
  const w = T.x1 - T.x0 + HX * (top + roofH + 8) + 8, h = T.y1 - T.y0 + HY * (top + roofH + 8) + 8;
  return structSprite(S, x0, y0, w, h, (g) => {
    faceStones(g, T.x0, T.y0, T.y1, 0, top, P.stone, 700 + idx);
    shadeFaceS(g, T.x0, T.x1, T.y1, 0, top);
    // arrow slits on the west face
    for (const fz of [16, 30]) { const p0 = PR(T.x0, (T.y0 + T.y1) / 2 - 1, fz), p1 = PR(T.x0, (T.y0 + T.y1) / 2 - 1, fz + 6); g.beginPath(); g.moveTo(p0[0], p0[1]); g.lineTo(p1[0], p1[1]); g.strokeStyle = P.ink; g.lineWidth = 1.2; g.stroke(); }
    // hanging banner on gate towers: indigo cloth with the hawk, our mark seen from the field
    if (T.gate) {
      const yc = (T.y0 + T.y1) / 2, a = PR(T.x0, yc - 5, top - 4), b = PR(T.x0, yc + 5, top - 4), c = PR(T.x0, yc + 5, top - 20), d = PR(T.x0, yc, top - 23), e = PR(T.x0, yc - 5, top - 20);
      poly(g, [a, b, c, d, e]); g.fillStyle = P.indigo; g.fill(); g.strokeStyle = P.ink; g.lineWidth = 0.6; g.stroke();
      const m = PR(T.x0, yc, top - 11);
      g.beginPath(); g.moveTo(m[0] - 1, m[1] - 3); g.lineTo(m[0] + 0.3, m[1] + 1.5); g.lineTo(m[0] + 1.6, m[1] - 3.2); g.strokeStyle = P.paperHi; g.lineWidth = 1.0; g.stroke();
    }
    topFace(g, T.x0, T.x1, T.y0, T.y1, top, P.stoneMid, 900 + idx);
    // crenellations on west and south edges
    for (let y = T.y0; y < T.y1 - 1; y += 7) merlon(g, T.x0, y, Math.min(T.y1, y + 4.5), top, 5, 3);
    for (let x = T.x0 + 3; x < T.x1 - 2; x += 7) { const xa = x, xb = Math.min(T.x1, x + 4); faceStonesSimple(g, xa, T.y1 - 3, T.y1, top, top + 5); shadeFaceS(g, xa, xb, T.y1, top, top + 5); topFace(g, xa, xb, T.y1 - 3, T.y1, top + 5, P.paperHi, 0); }
    if (T.roof) {
      // conical slate roof: lit west half, hatched east half, scalloped courses
      const cx = (T.x0 + T.x1) / 2, cy = (T.y0 + T.y1) / 2, r = (T.x1 - T.x0) / 2 + 2;
      const apex = PR(cx, cy, top + roofH + 8), L = PR(cx - r, cy, top + 3), Rr = PR(cx + r, cy, top + 3), F = PR(cx, cy + r * 0.75, top + 3);
      poly(g, [L, apex, Rr, F]); g.fillStyle = P.ink2; g.fill();
      poly(g, [L, apex, F]); g.fillStyle = P.wash2; g.fill();
      g.save(); poly(g, [L, apex, Rr, F]); g.clip();
      for (let k = 1; k < 7; k++) { const t = k / 7; g.beginPath(); g.moveTo(L[0] + (apex[0] - L[0]) * t, L[1] + (apex[1] - L[1]) * t); g.quadraticCurveTo(F[0] + (apex[0] - F[0]) * t, F[1] + (apex[1] - F[1]) * t + 2.5 * (1 - t), Rr[0] + (apex[0] - Rr[0]) * t, Rr[1] + (apex[1] - Rr[1]) * t); g.strokeStyle = hexA(P.ink, 0.7); g.lineWidth = 0.45; g.stroke(); }
      hatch(g, F[0], apex[1], Rr[0] + 4, F[1] + 2, 1.25, 1.2, 0.4, P.ink, 0.65, idx);
      g.restore();
      poly(g, [L, apex, Rr, F]); g.strokeStyle = P.ink; g.lineWidth = 0.8; g.stroke();
      // snow on the west flank
      g.beginPath(); g.moveTo(L[0] + 1, L[1] - 1); g.quadraticCurveTo((L[0] + apex[0]) / 2 - 1, (L[1] + apex[1]) / 2, apex[0] - 0.5, apex[1] + 3); g.lineTo((L[0] + apex[0]) / 2 + 2, (L[1] + apex[1]) / 2 + 2); g.closePath(); g.fillStyle = P.paperHi; g.fill();
    }
  });
}

function buildStructures(S) {
  const list = [];
  let idx = 0;
  for (const [a, b] of WALLSEG) {
    for (let y = a; y < b; y += 16) list.push({ key: y, kind: 'wall', spr: wallRow(S, y, Math.min(b, y + 16), 0, idx++) });
  }
  TOWERS.forEach((T, i) => { const spr = towerSprite(S, T, i); list.push({ key: T.y0 + 0.5, kind: 'tower', spr, T, cut: i === 2 ? cutaway(spr, S, GY1 - 5, 61) : null }); });

}

  // ---------- one-time art ----------
  buildBig() {
    const S = this.S;
    const mk = (w, h, ax, ay, fn) => { const c = mkCanvas(w * S, h * S), g = c.getContext('2d'); g.setTransform(S, 0, 0, S, ax * S, ay * S); fn(g); lightPass(c, S, 0.7, 0.28); return { img: c, ax: ax * S, ay: ay * S }; };

  buildOverlay() {

    const W = this.cv.width, H = this.cv.height;
    const c = mkCanvas(W, H), g = c.getContext('2d');
    const lg = g.createLinearGradient(0, 0, W, H * 0.3);
    lg.addColorStop(0, '#F7D9A8'); lg.addColorStop(0.42, '#F3E8D4'); lg.addColorStop(0.78, '#DCD8D2'); lg.addColorStop(1, '#BDBEC6');

  buildBlobs() {

      g.beginPath(); g.moveTo(-8, -4); g.quadraticCurveTo(-8, 7, 0, 7); g.quadraticCurveTo(8, 7, 8, -4); g.closePath(); g.fillStyle = ink; g.fill();
      g.beginPath(); g.moveTo(-9, -4); g.lineTo(9, -4); g.lineWidth = 1.8; g.strokeStyle = ink; g.stroke();
      g.beginPath(); g.moveTo(-5, 2); g.lineTo(-2, 5); g.strokeStyle = P.paperHi; g.lineWidth = 0.9; g.stroke();

      for (const x of [9, 14]) brush(g, qpts(x, 6, x - 2, 3.5, x + 1, 0.5, 6), nib(1.3), ink, 0.55);

      g.save(); g.translate(5, 3.5);

      g.save(); g.translate(0.8, 0.6); path(); g.clip(); drawEmblem(g, opts.e, w, h); g.restore();
      path(); g.strokeStyle = ink; g.lineWidth = 1.7; g.stroke();
      g.restore();
    }
    return c;
  },
};

      if (s.sel) brush(g, [[10, 43.5], [80, 42.8], [142, 43.6]], nib(2.2), P.gold, 0.95);
      d.appendChild(bg);

      const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = s.name; d.appendChild(nm);
      const ct = document.createElement('div'); ct.className = 'ct'; d.appendChild(ct);
      const st = document.createElement('div'); st.className = 'st'; d.appendChild(st);

      cards.appendChild(d);
      return { s, ct, st, mb, last: {} };
    });
    this.ens = document.getElementById('enso');
    this.ens.width = 58 * DPR; this.ens.height = 58 * DPR;
    this.kbar = document.getElementById('kbar'); this.kbar.width = 64 * DPR; this.kbar.height = 10 * DPR;
    this.drawBar(this.kbar, 64, 10, sim.keep / 100, P.indigo);
    const ab = document.getElementById('abil');
    const abg = mkCanvas(58 * DPR, 58 * DPR); abg.className = 'abg'; abg.style.width = '58px'; abg.style.height = '58px';
    const ag = abg.getContext('2d'); ag.scale(DPR, DPR); ag.save(); ag.beginPath(); ag.arc(29, 29, 26, 0, 7); ag.clip(); ag.drawImage(UIART.paper(58, 58, 41, P.paperHi), 0, 0); ag.restore();
    brush(ag, Array.from({ length: 33 }, (_, i) => { const a = -1.2 + (i / 32) * 6.1; return [29 + Math.cos(a) * 26, 29 + Math.sin(a) * 26]; }), (u) => 0.6 + 2.4 * Math.sin(Math.PI * u), P.ink, 0.95);

  drawBar(c, w, h, k, col) {
    const g = c.getContext('2d'); g.setTransform(DPR, 0, 0, DPR, 0, 0); g.clearRect(0, 0, w, h);
    brush(g, [[2, h / 2 + 0.5], [w - 2, h / 2 - 0.3]], nib(h * 0.55), 'rgba(30,25,22,0.18)', 1);
    if (k > 0.01) brush(g, [[2, h / 2 + 0.6], [2 + (w - 4) * k, h / 2 - 0.2]], (u) => h * 0.62 * (u > 0.9 ? 1 - (u - 0.9) * 6 : 1), col, 1);
  },
  bark(key, sim, live) {
    const pool = BARKS[key]; if (!pool) return;
    const b = pool[(sim.steps + key.length) % pool.length];
    this.barkQ.push({ ...b, t: sim.t });
    if (this.barkQ.length > 4) this.barkQ.shift();
    // the chronicler writes down what actually happened, with real numbers
    if (key === 'gate_break') this.chronQ.push({ t: sim.t, text: `셋째 물결. 서문 빗장이 충차에 부러졌다. 회색매 창병대가 문턱을 막아선다.` });
    if (key === 'oil') this.chronQ.push({ t: sim.t, text: `남쪽 사다리에 끓는 기름을 부었다. 협약군 ${sim.stats.oilFell || 0}명이 떨어졌다.` });
    if (key === 'ram_burn') this.chronQ.push({ t: sim.t + 5, text: null });
  },
  chronicleNow(sim) {
    // a live line built from the sim's counts (josa picked by the last syllable)
    const sp = sim.squads[0], lostAll = sim.squads.reduce((a, s) => a + s.lost, 0);
    const brokeT = sim.stats.gateBrokenT;
    if (brokeT < 0) return null;
    const mins = Math.max(1, Math.round(sim.t - brokeT));
    return `서문이 뚫린 지 ${mins}초. ${josa(sp.name, '이/가')} 문턱을 지킨다. 우리 쪽 쓰러진 이 ${lostAll}명, 적 ${sim.kills.ours}명.`;
  },
  update(sim) {
    const ren = this.ren;
    // keep + wave
    const keep = Math.round(sim.keep);
    if (this.last.keep !== keep) { this.last.keep = keep; document.getElementById('keepTxt').textContent = keep + '%'; this.drawBar(this.kbar, 64, 10, keep / 100, P.indigo); }
    // cards
    for (const c of this.cards) {
      const s = c.s, alive = s.units.filter((u) => u.st === ST.ACTIVE).length;
      const engaged = s.units.some((u) => u.st === ST.ACTIVE && u.tgt && u.tgt.st === ST.ACTIVE && Math.hypot(u.tgt.x - u.x, u.tgt.y - u.y) < 16);
      const word = s.morale < 35 ? '흔들림' : engaged ? '교전' : '대기';
      if (c.last.alive !== alive) { c.last.alive = alive; c.ct.innerHTML = `<b>${alive}</b><i>/${s.n}</i>`; }
      if (c.last.word !== word) { c.last.word = word; c.st.textContent = word; c.st.className = 'st' + (word === '교전' ? ' red' : word === '흔들림' ? ' warn' : ''); }
      const m = Math.round(s.morale);
      if (c.last.m !== m) { c.last.m = m; this.drawBar(c.mb, 40, 7, m / 100, m < 35 ? P.cinnabar : P.ink2); }
    }
    // ability cooldown: a brush circle that closes as the cauldron reheats
    const a = sim.abil.oil, k = a.cd > 0 ? 1 - a.cd / a.max : 1;
    const kk = Math.round(k * 60);
    if (this.last.cd !== kk) {
      this.last.cd = kk;
      const g = this.ens.getContext('2d'); g.setTransform(DPR, 0, 0, DPR, 0, 0); g.clearRect(0, 0, 58, 58);
      if (k < 1) {
        const pts = []; const n = 40; for (let i = 0; i <= n; i++) { const t = (i / n) * k; const ang = -Math.PI / 2 + t * 6.283; pts.push([29 + Math.cos(ang) * 21.5, 29 + Math.sin(ang) * 21.5]); }
        brush(g, pts, (u) => 1.2 + 2.4 * Math.sin(Math.PI * Math.min(1, u * 1.1)), P.cinnabar, 0.9);
        g.fillStyle = 'rgba(232,223,203,0.55)'; g.beginPath(); g.arc(29, 29, 19.5, 0, 7); g.fill();
      }
      document.getElementById('acd').textContent = a.cd > 0 ? Math.ceil(a.cd) + '' : '';
      document.getElementById('abil').classList.toggle('ready', a.cd <= 0);
    }
    // chronicle line (top centre)
    let line = null;
    for (const c of this.chronQ) if (sim.t >= c.t && sim.t - c.t < 7) line = c.text === null ? this.chronicleNow(sim) : c.text;
    if (!line && sim.t > 14) line = this.chronicleNow(sim);
    const ch = document.getElementById('chron');
    if (line !== this.last.line) { this.last.line = line; document.getElementById('chronTxt').textContent = line || ''; ch.classList.toggle('on', !!line); }
    // barks: world-anchored slips over the squad that speaks (never over the enemy's side)
    const box = document.getElementById('barks');
    const live = this.barkQ.filter((b) => sim.t - b.t < 3.2).slice(-1);
    const key = live.map((b) => b.text).join('|');
    if (key !== this.last.barks) {
      this.last.barks = key; box.innerHTML = '';
      for (const b of live) { const d = document.createElement('div'); d.className = 'bark'; d.innerHTML = `<b>${b.who}</b>${b.text}`; d.dataset.sq = b.sq; box.appendChild(d); }
    }
    for (const d of box.children) {
      const s = sim.squads[+d.dataset.sq]; const al = s.units.filter((u) => u.st === ST.ACTIVE); if (!al.length) continue;
      let cx = 0, cy = 0; for (const u of al) { cx += u.x; cy += u.y; } cx /= al.length; cy /= al.length;
      const p = PR(cx, cy, s.type === 'wall' ? WH : 0);
      const sx = (p[0] * ren.Sz + ren.ox) / DPR, sy = (p[1] * ren.Sz + ren.oy) / DPR;
      const w = d.offsetWidth;
      // the gate fight is sacred: a bark never sits over the gate passage, it goes above-right
      const gp = PR(WX + WW + 10, GYC, 0), gx = (gp[0] * ren.Sz + ren.ox) / DPR, gy = (gp[1] * ren.Sz + ren.oy) / DPR;
      let L = Math.max(ren.vw * 0.55, Math.min(ren.vw - w - 8, sx + 10)), T = Math.max(62, Math.min(ren.vh - 112 - d.offsetHeight, sy - 58));
      if (L < gx + 70 && L + w > gx - 50 && T + d.offsetHeight > gy - 40 && T < gy + 30) T = Math.max(62, gy - 48 - d.offsetHeight - 30);
      d.style.left = L + 'px'; d.style.top = T + 'px';
    }
  },
};

// ============================================================================
// ?sheet=1 — the woodcut "plate book": every unit kind of both attacking races and
// the defenders, every animation frame, on a neutral ground. Same code path as the
// game (Atlas + drawFigure + lightPass), only drawn larger.
// ============================================================================
function drawSheet() {
  const cv = document.getElementById('c'), W = window.innerWidth, H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR; cv.style.width = W + 'px'; cv.style.height = H + 'px';
  document.getElementById('hud').style.display = 'none';
  const g = cv.getContext('2d');
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.fillStyle = '#E6E1D7'; g.fillRect(0, 0, W, H);
  // faint ruled grid like a plate register
  g.strokeStyle = 'rgba(30,25,22,0.05)'; g.lineWidth = 1;
  for (let x = 0; x < W; x += 16) { g.beginPath(); g.moveTo(x + 0.5, 0); g.lineTo(x + 0.5, H); g.stroke(); }
  for (let y = 0; y < H; y += 16) { g.beginPath(); g.moveTo(0, y + 0.5); g.lineTo(W, y + 0.5); g.stroke(); }
  const font = (w, s) => `${w} ${s}px "Gowun Batang", serif`;
  const txt = (s, x, y, size, col = P.ink, w = 400, align = 'left') => { g.font = font(w, size); g.fillStyle = col; g.textAlign = align; g.textBaseline = 'alphabetic'; g.fillText(s, x, y); };

  // title
  txt('잿빛 연대기 — 병종 판화첩', 18, 30, 21, P.ink, 700);
  txt('코드로 새긴 목판 스프라이트 · 모든 병종 · 모든 프레임 · 빛은 늘 서남서에서', 262, 29, 12, P.ink2);
  g.fillStyle = P.cinnabar; g.fillRect(W - 120, 12, 102, 24);
  txt('제5권 부록', W - 69, 29, 13, P.paperHi, 700, 'center');

  const sc = 1.85, RH = 47, LX = 186, X1 = W - 12, nF = 17, cw = (X1 - LX) / nF;
  ATLAS = new Atlas(sc * DPR, 36, 34, 18, 28);
  // column header: animation groups with their frame counts
  let col = 0;
  const groups = ANIM_ORDER.map((a) => ({ a, n: ANIMS[a] }));
  const top = 46;
  for (const G of groups) {
    const x0 = LX + col * cw, x1 = x0 + G.n * cw;
    g.fillStyle = G.a === 'dead' ? 'rgba(30,25,22,0.08)' : col % 2 ? 'rgba(30,25,22,0.035)' : 'rgba(255,255,255,0.25)';
    g.fillRect(x0, top + 16, x1 - x0, 11 * RH + 2);
    txt(`${ANIM_KO[G.a]}${G.a === 'dead' ? ' (먹으로)' : ''} · ${G.n}`, (x0 + x1) / 2, top + 6, 12, G.a === 'die' || G.a === 'dead' ? P.cinnabar : P.ink, 700, 'center');
    for (let f = 0; f < G.n; f++) txt(String(f + 1), x0 + (f + 0.5) * cw, top + 22, 9, P.ink2, 400, 'center');
    g.beginPath(); g.moveTo(x0 + 0.5, top + 12); g.lineTo(x0 + 0.5, top + 16 + 11 * RH); g.strokeStyle = 'rgba(30,25,22,0.25)'; g.stroke();
    col += G.n;
  }
  const raceCol = { '할드미어 변경군': P.indigo, '아우렐 협약군': P.rust, '애쉬터스크 군단': P.orc };
  const order = ['d_spear', 'd_sword', 'd_archer', 'd_folk', 'h_levy', 'h_maa', 'h_bow', 'h_ladder', 'o_grunt', 'o_goblin', 'o_berserk'];
  const notes = { d_spear: '문턱을 지키는 창벽', d_sword: '연 모양 방패, 반격', d_archer: '성가퀴의 활', d_folk: '물·화살·들것을 나르는 성안 사람', h_levy: '빚에 끌려온 갈고리창', h_maa: '사슬갑옷, 해 문장 방패', h_bow: '방패 뒤의 장궁', h_ladder: '사다리를 메고 달린다', o_grunt: '털망토, 식칼 같은 도끼', o_goblin: '작고 빠르다, 단검', o_berserk: '맨몸, 붉은 칠, 쌍도끼' };
  order.forEach((id, row) => {
    const k = KIDX[id], K = KINDS[k], y0 = top + 26 + row * RH, base = y0 + 40;
    if (row === 4 || row === 8) { g.beginPath(); g.moveTo(10, y0 - 1.5); g.lineTo(X1, y0 - 1.5); g.strokeStyle = P.ink; g.lineWidth = 1.2; g.stroke(); g.lineWidth = 1; }
    g.fillStyle = raceCol[K.race]; g.fillRect(14, y0 + 5, 5, 34);

    txt(K.race, 26, y0 + 31, 10.5, raceCol[K.race], 700);
    txt(notes[id], 26, y0 + 43, 9.5, P.ink2);
    const dir = K.side === 0 && !K.folk ? -1 : 1;

        if (skip) { txt('—', cx, base - 10, 12, 'rgba(30,25,22,0.3)', 400, 'center'); continue; }
        const fr = G.a === 'dead' ? corpseFrame(k, 0, f, dir) : unitFrame(k, (f + c) % 2 && G.a === 'idle' ? 1 : 0, G.a, f, dir);
        g.setTransform(1, 0, 0, 1, 0, 0);

    g.setTransform(DPR, 0, 0, DPR, 0, 0);
  });

  // bottom strip: siege engine (swing phases + wreck), gate states, standards
  const by = top + 26 + 11 * RH + 8;
  g.beginPath(); g.moveTo(10, by - 4); g.lineTo(X1, by - 4); g.strokeStyle = P.ink; g.lineWidth = 1.2; g.stroke(); g.lineWidth = 1;
  const S2 = 1.25 * DPR;
  const big = (w, h, ax, ay, fn) => { const c = mkCanvas(w * S2, h * S2), q = c.getContext('2d'); q.setTransform(S2, 0, 0, S2, ax * S2, ay * S2); fn(q); lightPass(c, S2, 0.7, 0.28); return { img: c, ax: ax * S2, ay: ay * S2 }; };
  const shed = big(60, 42, 30, 34, (q) => drawRamShed(q, 'ok')), wreck = big(60, 42, 30, 34, (q) => drawRamShed(q, 'wreck')), log = big(60, 42, 30, 34, (q) => drawRamLog(q));
  const put = (b, x, y) => { g.setTransform(1, 0, 0, 1, 0, 0); g.drawImage(b.img, Math.round(x * DPR - b.ax), Math.round(y * DPR - b.ay)); g.setTransform(DPR, 0, 0, DPR, 0, 0); };
