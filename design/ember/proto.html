<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>잿불 시안</title>
<style>
:root{
  --ink:#ece2cf; --ink2:#b9ad98; --ink3:#857a6a;
  --slate:#151316; --slate-a:rgba(17,15,17,.80); --edge:#5b5046; --edge2:#2c2724;
  --ember:#e0782f; --ember2:#ffb15a; --friend:#8fb0dc; --foe:#c4574e; --gold:#d6a443;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0d0c0e;overflow:hidden;-webkit-user-select:none;user-select:none}
body{font-family:'Gowun Batang','Noto Serif KR','Nanum Myeongjo','WenQuanYi Zen Hei',serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.sans{font-family:'Pretendard','Noto Sans KR','WenQuanYi Zen Hei',sans-serif}
#cv{position:absolute;left:0;top:0;width:100vw;height:100vh;display:block;image-rendering:pixelated}
#hud{position:absolute;inset:0;pointer-events:none}
/* plates: chipped corners, rule = 3px top-left, 6px bottom-right; 1px warm edge */
.plate{position:absolute;background:var(--slate-a);border:1px solid var(--edge);
  clip-path:polygon(3px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 3px)}
.plate::after{content:"";position:absolute;inset:2px;border-top:1px solid rgba(255,235,200,.06);pointer-events:none}
#top{left:8px;top:6px;height:30px;display:flex;align-items:center;gap:0;padding:0 10px 0 6px}
#top .seg{display:flex;align-items:baseline;gap:5px;padding:0 9px;border-right:1px solid var(--edge2);height:18px;line-height:18px}
#top .seg:last-child{border-right:0}
#top .lab{font-size:11px;color:var(--ink3);letter-spacing:.02em}
#top .val{font-size:14px;color:var(--ink);font-weight:700}
#top .val.warn{color:#e9a25a}
#top .val.bad{color:#e46b55}
#top canvas{display:block}
#dawn{left:50%;top:6px;height:30px;transform:translateX(-50%);display:flex;align-items:center;gap:7px;padding:0 10px}
#dawn .lab{font-size:11px;color:var(--ink2)}
#speed{right:8px;top:6px;height:30px;display:flex;align-items:center;padding:0 4px;gap:2px}
#speed .b{width:30px;height:22px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink2)}
#speed .b.on{color:#1a1410;background:var(--ink2);clip-path:polygon(2px 0,100% 0,100% calc(100% - 3px),calc(100% - 3px) 100%,0 100%,0 2px)}
.card{bottom:8px;width:168px;height:54px;display:flex;gap:7px;padding:5px 8px 5px 6px}
.card.sel{border-color:var(--ember);box-shadow:inset 0 0 0 1px rgba(224,120,47,.35)}
.card .em{flex:none;width:24px;height:36px;margin-top:2px}
.card .tx{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between}
.card .nm{font-size:13px;font-weight:700;white-space:nowrap;line-height:15px}
.card .ld{font-size:10.5px;color:var(--ink3);white-space:nowrap;line-height:12px}
.card .row{display:flex;align-items:center;gap:6px;line-height:12px}
.card .cnt{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.card .mor{flex:1;height:5px;background:#2a2421;position:relative}
.card .mor i{position:absolute;left:0;top:0;bottom:0;background:#a9b8c8}
.card .mor b{position:absolute;top:-2px;width:1px;height:9px;background:#5b5046}
.card .mw{font-size:10px;color:var(--ink2);white-space:nowrap}
.card .wd{font-size:10px;color:#d39a7a;white-space:nowrap;display:flex;align-items:center;gap:2px}
#c1{left:8px}#c2{left:184px}
#abil{right:8px;bottom:8px;width:76px;height:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
#abil .nm{font-size:12px;font-weight:700}
#abil .cd{font-size:10px;color:var(--ink3);font-variant-numeric:tabular-nums}
#bark{left:50%;bottom:72px;transform:translateX(-30%);max-width:440px;padding:6px 12px 7px 10px;font-size:13px;line-height:17px;opacity:0;transition:opacity .25s}
#bark.on{opacity:1}
#bark .who{color:var(--ember2);font-weight:700;margin-right:6px}
#bark .who.foe{color:#d9776a}
/* ui=1 */
#ui{position:absolute;inset:0;pointer-events:none}
.brief{right:10px;top:10px;bottom:10px;width:300px;padding:12px 14px 12px 14px;display:flex;flex-direction:column;gap:8px}
.brief h1{margin:0;font-size:22px;letter-spacing:.04em;line-height:26px}
.brief .sub{font-size:12px;color:var(--ink3);margin-top:-4px}
.brief .meta{display:flex;gap:10px;font-size:11.5px;color:var(--ink2);align-items:center}
.brief .meta canvas{vertical-align:middle}
.brief .say{font-size:13px;line-height:19px;padding-left:8px;border-left:2px solid #4a403a}
.brief .say b{color:var(--ember2);font-weight:700;margin-right:4px}
.brief .say.foe b{color:#d9776a}
.brief .sq{display:flex;gap:6px;flex-wrap:wrap}
.brief .sq span{font-size:11px;color:var(--ink2);border:1px solid #3a332e;padding:2px 6px 3px}
.brief .sq span.v{color:var(--ink);border-color:#6a5a48}
.brief .go{margin-top:auto;height:44px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;letter-spacing:.2em;color:#1d140c;background:#d39a4a;
  clip-path:polygon(3px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 3px)}
.mapttl{left:12px;top:10px;padding:6px 12px 7px 10px;max-width:330px}
.mapttl .t{font-size:16px;font-weight:700;letter-spacing:.06em}
.mapttl .s{font-size:11px;color:var(--ink3)}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">
  <div id="top" class="plate">
    <div class="seg"><span class="lab">물결</span><span class="val" id="hWave">3</span><span class="lab">/ 5</span></div>
    <div class="seg"><span class="lab">본성</span><span class="val" id="hKeep">100%</span></div>
    <div class="seg"><span class="lab">서문</span><span class="val" id="hGate">버팀</span></div>
  </div>
  <div id="dawn" class="plate"><canvas id="dawnCv" width="96" height="22"></canvas><span class="lab" id="hDawn">새벽까지 물결 둘</span></div>
  <div id="speed" class="plate"><div class="b" id="bPause"></div><div class="b on">1×</div><div class="b">2×</div></div>
  <div id="c1" class="plate card sel"><canvas class="em" id="em1" width="48" height="72"></canvas><div class="tx">
    <div class="nm">개울목 방패대</div><div class="ld">대장 강쇠 · 문지기</div>
    <div class="row"><span class="cnt" id="n1">10/10</span><span class="mor"><i id="m1"></i><b style="left:40%"></b></span><span class="mw" id="mw1">굳건</span></div></div></div>
  <div id="c2" class="plate card"><canvas class="em" id="em2" width="48" height="72"></canvas><div class="tx">
    <div class="nm">잿빛 창대</div><div class="ld">대장 버들 · 셋째 겨울</div>
    <div class="row"><span class="cnt" id="n2">12/12</span><span class="mor"><i id="m2"></i><b style="left:40%"></b></span><span class="mw" id="mw2">굳건</span></div></div></div>
  <div id="abil" class="plate"><canvas id="abCv" width="72" height="64" style="width:36px;height:32px"></canvas><div class="nm">끓는 기름</div><div class="cd" id="abCd">준비됨</div></div>
  <div id="bark" class="plate"><span class="who" id="bWho"></span><span id="bTxt"></span></div>
</div>
<div id="ui" hidden></div>
<script>
'use strict';
// =====================================================================================
// 잿불 시안 — procedural prototype. Everything on screen is drawn by this file.
// Sim (S.*) is deterministic: seeded RNG, fixed step 1/30 s, never reads render state.
// Render (R.*) only reads sim state and drains S.fx.
// =====================================================================================
const Q = new URLSearchParams(location.search);
const P_T = Math.max(0, +(Q.get('t') || 0));
const P_ZOOM = Q.has('zoom') ? +Q.get('zoom') : 0;
const P_SHEET = Q.get('sheet') === '1';
const P_UI = Q.get('ui') === '1';
const P_N = Q.has('n') ? Math.max(40, Math.min(1200, +Q.get('n'))) : 0;
const P_SEED = Q.has('seed') ? (+Q.get('seed') >>> 0) : 1112;
const P_PAUSE = Q.get('pause') === '1';
const LOW = Q.get('q') === 'low';
const DT = 1 / 30;
const PROF = { on: false, t: 0, acc: {} }; function pm(name) { if (!PROF.on) return; const n = performance.now(); PROF.acc[name] = (PROF.acc[name] || 0) + n - PROF.t; PROF.t = n; } window.__PROF = PROF;

// ---------------------------------------------------------------- RNG & noise
function mulberry(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const simR = mulberry(P_SEED);              // SIM ONLY
const fxR = mulberry(P_SEED ^ 0x5bd1e995);  // render only
function hash2(x, y, s) { let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s | 0, 1274126177)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
function vnoise(x, y, s) { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi; const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf); const a = hash2(xi, yi, s), b = hash2(xi + 1, yi, s), c = hash2(xi, yi + 1, s), d = hash2(xi + 1, yi + 1, s); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; }
function fbm(x, y, s, o) { let v = 0, a = 0.5, f = 1, t = 0; for (let i = 0; i < o; i++) { v += a * vnoise(x * f, y * f, s + i * 31); t += a; a *= 0.5; f *= 2.03; } return v / t; }
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const rgb = (c, a) => (a === undefined ? `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})` : `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`);

// ---------------------------------------------------------------- palette (ash & ember)
// Each material is a 4-step ramp: shadow, base, light, highlight. Light comes from the west (low sun / moon).
const RAMP = [null]; const MT = {};
function mat(n, a) { MT[n] = RAMP.length; RAMP.push(a.map(hex)); }
mat('skin', ['#4a2f24', '#86573f', '#b07e5e', '#d2a37c']);
mat('orc', ['#232a18', '#404c2c', '#617046', '#88966a']);
mat('gob', ['#2a2c12', '#5a6224', '#828f36', '#a9b556']);
mat('steel', ['#22252b', '#4e5560', '#848c98', '#c0c7d0']);
mat('iron', ['#1a1716', '#36302d', '#564d47', '#7a6f66']);
mat('rust', ['#271610', '#552d17', '#7d4527', '#a2663d']);
mat('blue', ['#152037', '#283f66', '#3f6196', '#7495c6']);
mat('bgrey', ['#1c232d', '#364253', '#536379', '#8193aa']);
mat('ash', ['#56524c', '#958f85', '#cbc4b8', '#efe9de']);
mat('crim', ['#2e0b0f', '#6a1a20', '#972a32', '#c3585c']);
mat('cream', ['#463c2c', '#8a7a5c', '#bfae88', '#e3d5b2']);
mat('leath', ['#22160e', '#46301f', '#694a2e', '#8b6743']);
mat('dark', ['#110f11', '#242022', '#383133', '#524849']);
mat('wood', ['#281a0f', '#52371e', '#77512e', '#9b7344']);
mat('bone', ['#4c4335', '#958a70', '#c6b997', '#e6dcc0']);
mat('hair', ['#181010', '#362316', '#563a22', '#765433']);
mat('gold', ['#382808', '#775616', '#b0872a', '#ddb957']);
mat('herb', ['#122418', '#24452d', '#3c6844', '#679766']);
mat('rag', ['#211b14', '#433727', '#62533c', '#827055']);
mat('char', ['#0b0807', '#1c1512', '#2f241d', '#4a3423']);
mat('stone', ['#272422', '#4b4641', '#6f6860', '#958c80']);
mat('canv', ['#454036', '#827969', '#ada38d', '#d0c6ae']);
mat('hide', ['#271a12', '#533a27', '#735437', '#93714c']);
mat('straw', ['#3a3018', '#6e5c2c', '#9a8443', '#c0a95f']);
mat('emb', ['#7a2a08', '#c0521a', '#f08a2a', '#ffd27a']);
mat('green', ['#1b2a1c', '#2f4a30', '#4b6b43', '#6f8f5a']);
mat('bluepale', ['#2b3646', '#4e5f78', '#7a8ca6', '#b3c2d6']);

// ---------------------------------------------------------------- pixel rasterizer
class Ras {
  constructor(w, h) { this.w = w; this.h = h; this.m = new Uint8Array(w * h); this.s = new Int8Array(w * h); }
  clear() { this.m.fill(0); this.s.fill(0); }
  p(x, y, m, s) { x = Math.floor(x); y = Math.floor(y); if (x < 0 || y < 0 || x >= this.w || y >= this.h) return; const i = y * this.w + x; this.m[i] = m; this.s[i] = s; }
  line(x0, y0, x1, y1, m, s, th) { const dx = x1 - x0, dy = y1 - y0; const n = Math.max(1, Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)) * 1.2)); for (let i = 0; i <= n; i++) { const x = x0 + (dx * i) / n, y = y0 + (dy * i) / n; this.p(x, y, m, s); if (th > 1) { if (Math.abs(dx) > Math.abs(dy)) this.p(x, y + 1, m, s); else this.p(x + RT.tf, y, m, s); } } }
  poly(P, m, s) { let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9; for (const q of P) { if (q[0] < x0) x0 = q[0]; if (q[0] > x1) x1 = q[0]; if (q[1] < y0) y0 = q[1]; if (q[1] > y1) y1 = q[1]; }
    for (let y = Math.floor(y0); y <= Math.ceil(y1); y++) for (let x = Math.floor(x0); x <= Math.ceil(x1); x++) { const cx = x + 0.5, cy = y + 0.5; let ins = false; for (let i = 0, j = P.length - 1; i < P.length; j = i++) { const a = P[i], b = P[j]; if ((a[1] > cy) !== (b[1] > cy) && cx < ((b[0] - a[0]) * (cy - a[1])) / (b[1] - a[1]) + a[0]) ins = !ins; } if (ins) this.p(x, y, m, s); } }
  rect(x, y, w, h, m, s) { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) this.p(x + i, y + j, m, s); }
  ell(cx, cy, rx, ry, m, s) { for (let y = Math.floor(cy - ry - 1); y <= cy + ry + 1; y++) for (let x = Math.floor(cx - rx - 1); x <= cx + rx + 1; x++) { const a = (x + 0.5 - cx) / rx, b = (y + 0.5 - cy) / ry; if (a * a + b * b <= 1) this.p(x, y, m, s); } }
}
// rig transform: local (x = forward, y = up, feet at 0,0) -> raster
const RT = { r: null, ax: 0, ay: 0, f: 1, rot: 0, tf: -1 };
function T(lx, ly) { const c = Math.cos(RT.rot), s = Math.sin(RT.rot); const rx = lx * c - ly * s, ry = lx * s + ly * c; return [RT.ax + RT.f * rx, RT.ay - ry]; }
function L(a, b, m, s, th) { const A = T(a[0], a[1]), B = T(b[0], b[1]); RT.r.line(A[0], A[1], B[0], B[1], m, s, th || 1); }
function PG(pts, m, s) { RT.r.poly(pts.map((q) => T(q[0], q[1])), m, s); }
function EL(c, rx, ry, m, s) { const pts = []; for (let i = 0; i < 14; i++) { const a = (i / 14) * Math.PI * 2; pts.push([c[0] + Math.cos(a) * rx, c[1] + Math.sin(a) * ry]); } PG(pts, m, s); }
function DOT(a, m, s) { const A = T(a[0], a[1]); RT.r.p(A[0], A[1], m, s); }
const add = (a, b) => [a[0] + b[0], a[1] + b[1]];

const OUTL = [17, 12, 10];
// lighting + selective outline + baked contact shadow -> ImageData
function finalize(r, o) {
  o = o || {};
  const { w, h, m, s } = r; const img = new ImageData(w, h); const d = img.data;
  if (o.shadow) { const [sx, sy, rx, ry, a] = o.shadow; for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const u = (x + 0.5 - sx) / rx, v = (y + 0.5 - sy) / ry; const q = u * u + v * v; if (q <= 1) { const k = (y * w + x) * 4; d[k + 3] = Math.round(255 * a * (q < 0.55 ? 1 : 0.6)); } } }
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = y * w + x, mi = m[i]; if (!mi) continue; let sh = s[i];
    if (!o.flat) { const Lm = x > 0 ? m[i - 1] : 0, Rm = x < w - 1 ? m[i + 1] : 0, Um = y > 0 ? m[i - w] : 0; if (!Lm) sh++; if (!Um && Lm) sh++; if (!Rm) sh--; }
    sh = sh < 0 ? 0 : sh > 3 ? 3 : sh; const c = RAMP[mi][sh]; const k = i * 4; d[k] = c[0]; d[k + 1] = c[1]; d[k + 2] = c[2]; d[k + 3] = 255;
  }
  if (!o.noOutline) for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = y * w + x; if (m[i]) continue; const Rm = x < w - 1 ? m[i + 1] : 0, Lm = x > 0 ? m[i - 1] : 0, Um = y > 0 ? m[i - w] : 0, Dm = y < h - 1 ? m[i + w] : 0;
    if (!(Rm || Lm || Um || Dm)) continue; let c = OUTL;
    if (Rm && !Lm && !Um && !Dm) { const q = RAMP[Rm][0]; c = [q[0] * 0.75, q[1] * 0.75, q[2] * 0.75]; }
    const k = i * 4; d[k] = c[0]; d[k + 1] = c[1]; d[k + 2] = c[2]; d[k + 3] = 255;
  }
  return img;
}
function toCanvas(img) { const c = document.createElement('canvas'); c.width = img.width; c.height = img.height; c.getContext('2d').putImageData(img, 0, 0); return c; }

// ---------------------------------------------------------------- unit kinds & rigs
const BODY = {
  human: { leg: 5, torso: 5, head: 2.1, sw: 2.0, hw: 1.8, hunch: 0, headFwd: 0.3, arm: 4.4, k: 1, legW: 2, armW: 2 },
  orc: { leg: 5.5, torso: 6, head: 2.0, sw: 3.1, hw: 2.3, hunch: 1.9, headFwd: 1.5, arm: 5.6, k: 1.18, legW: 2, armW: 2 },
  gob: { leg: 3.2, torso: 3.4, head: 2.3, sw: 1.5, hw: 1.3, hunch: 0.8, headFwd: 0.6, arm: 3.2, k: 0.72, legW: 1, armW: 1 },
};
const KINDS = [
  { id: 'spear', nm: '창병', fac: '할드미어 변경군', side: 0, body: 'human', torso: 'blue', arms: 'steel', legs: 'dark', boots: 'leath', skin: 'skin', helm: 'kettle', hm: 'steel', weapon: 'spear', shield: 'buckler', sash: 'ash', hp: 100, dmg: 9, reach: 15, cd: 1.25, spd: 26, arm: 0.25 },
  { id: 'sword', nm: '방패검병', fac: '할드미어 변경군', side: 0, body: 'human', torso: 'blue', arms: 'steel', legs: 'dark', boots: 'leath', skin: 'skin', helm: 'nasal', hm: 'steel', weapon: 'sword', shield: 'kite', sash: 'ash', hp: 115, dmg: 11, reach: 7, cd: 1.0, spd: 24, arm: 0.4 },
  { id: 'archer', nm: '궁수', fac: '할드미어 변경군', side: 0, body: 'human', torso: 'bgrey', arms: 'bgrey', legs: 'dark', boots: 'leath', skin: 'skin', helm: 'hood', hm: 'bgrey', weapon: 'bow', sash: 'ash', quiver: 1, hp: 70, dmg: 10, reach: 6, cd: 1.9, spd: 24, arm: 0.1, range: 300 },

// ---------------------------------------------------------------- boot & loop
let acc = 0, last = 0; const PERF = { frames: 0, upd: 0, drw: 0, t0: 0, list: [] };
function boot() {
  resize(); buildAtlas(); buildProps(); buildSoft();
  if (P_SHEET) { $('hud').style.display = 'none'; drawSheet(); window.__ready = true; return; }
  if (P_UI) { drawUI(); window.__ready = true; return; }
  buildHeight(); renderAllStrips(); buildGround(); placeProps(); setupBattle();
  CAM.z = P_ZOOM || 1; if (P_ZOOM >= 1.6) { CAM.x = 522; CAM.y = 262; } else { CAM.x = 470; CAM.y = 266; }
  drawEmblem($('em1'), 'sword'); drawEmblem($('em2'), 'spear');
  { const b = $('bPause'); const c = document.createElement('canvas'); c.width = 24; c.height = 24; c.style.width = '12px'; c.style.height = '12px'; b.textContent = ''; b.appendChild(c); icon(c, drawPause); }
  // fast-forward
  const steps = Math.round(P_T / DT); R.ff = true;
  for (let i = 0; i < steps; i++) { R.ffWarm = steps - i < 120; simStep(); if (!R.ffWarm) { consumeFxFF(); } else { consumeFx(); emitters(DT, mood(S.t)); updParts(DT); } if (i % 4 === 0) processDecalQ(40); stampCorpses(); }
  processDecalQ(4000); R.ff = false;
  // only keep the latest bark when fast-forwarding
  if (R.barkQ.length > 1) R.barkQ = R.barkQ.slice(-1);
  window.__ready = true; last = performance.now(); requestAnimationFrame(loop);
}
function consumeFxFF() { // during fast-forward: persistent effects only
  for (const e of S.fx) { if (e.k === 'bark') { R.barkQ.push(e); continue; } if (['land', 'gatebreak', 'scorch', 'impact', 'ladderdown', 'blood'].includes(e.k)) { const one = [e]; const keep = S.fx; S.fx = one; consumeFx(); S.fx = keep; } }
  S.fx.length = 0;
}
function loop(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  const t0 = performance.now();
  if (!P_PAUSE) { acc += dt; let n = 0; while (acc >= DT && n < 4) { simStep(); acc -= DT; n++; } if (n === 4) acc = 0; if (PERF.on) PERF.steps += n; }
  const t1 = performance.now();
  render(P_PAUSE ? 1 : acc / DT, dt); hud(dt);
  const t2 = performance.now();
  if (PERF.on) { PERF.frames++; PERF.upd += t1 - t0; PERF.drw += t2 - t1; PERF.list.push(t2 - t0); }
  requestAnimationFrame(loop);
}
window.__perfStart = () => { PERF.on = true; PERF.steps = 0; PERF.frames = 0; PERF.upd = 0; PERF.drw = 0; PERF.list = []; };

addEventListener('resize', () => { if (!P_SHEET && !P_UI) resize(); });
boot();
