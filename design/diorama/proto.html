<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>축경 — 잿빛 성벽 시안</title>
<style>
:root{
  --walnut:#1f1712; --panel:rgba(33,25,19,.9); --panel2:rgba(46,35,26,.94);
  --line:#5d4832; --line-hi:#7d6545; --cream:#efe3c2; --dim:#b9a785; --mute:#8d7c62;
  --brass:#d9a441; --brass-d:#8f6420; --friend:#8db4dc; --friend-d:#2c5d93; --foe:#c8553d; --ok:#a9c27a;
  --serif:"Gowun Batang","Noto Serif KR","Nanum Myeongjo","WenQuanYi Zen Hei",serif;
  --sans:"Pretendard","Noto Sans KR","WenQuanYi Zen Hei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#17120e;overflow:hidden;color:var(--cream);font-family:var(--sans);-webkit-user-select:none;user-select:none}
canvas#c{position:absolute;left:0;top:0;display:block}
#hud{position:absolute;inset:0;pointer-events:none}
#hud .hit{pointer-events:auto}
/* ---------- top strip: castle side of the screen; the field side stays clear ---------- */
#top{position:absolute;left:0;right:0;top:0;height:42px;display:flex;align-items:center;gap:8px;padding:0 8px;
  background:var(--panel);border-bottom:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,236,200,.06),0 2px 0 rgba(0,0,0,.25)}
.ib{width:34px;height:30px;border:1px solid var(--line);border-radius:3px;background:var(--panel2);display:grid;place-items:center;
  box-shadow:inset 0 1px 0 rgba(255,236,200,.08)}
.ib canvas{width:18px;height:18px}
.wave{display:flex;align-items:center;gap:6px;flex:none}
.wave canvas{width:30px;height:22px}
.wave .t1{font:700 12.5px/15px var(--serif);letter-spacing:.02em;white-space:nowrap}
.wave .t2{font:10.5px/13px var(--sans);color:var(--dim);margin-top:1px;white-space:nowrap}
.pips{display:inline-flex;gap:3px;margin-left:5px;vertical-align:1px}
.pips i{width:6px;height:6px;transform:rotate(45deg);border:1px solid var(--dim);display:block}
.pips i.on{background:var(--cream);border-color:var(--cream)}
.pips i.now{background:var(--brass);border-color:var(--brass)}
.keep{display:flex;flex-direction:column;gap:3px;width:90px;flex:none}
.keep .row{display:flex;align-items:center;gap:4px;font:10.5px var(--sans);color:var(--dim);white-space:nowrap}
.keep canvas{width:13px;height:13px}
.bar{height:4px;background:#3b2e22;border-radius:1px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.3)}
.bar b{display:block;height:100%;background:var(--friend)}
.sep{width:1px;height:26px;background:var(--line)}
.card{height:34px;width:140px;flex:none;display:flex;align-items:center;gap:6px;padding:0 7px 0 4px;border:1px solid var(--line);border-radius:3px;background:var(--panel2);
  box-shadow:inset 0 1px 0 rgba(255,236,200,.07)}
.card.sel{border-color:var(--cream);box-shadow:inset 0 0 0 1px rgba(239,227,194,.35)}
.card canvas{width:20px;height:26px;flex:none}
.card .nm{font:700 11.5px/14px var(--serif);white-space:nowrap}
.card .meta{display:flex;align-items:center;gap:5px;margin-top:1px;height:14px}
.card .cnt{font:10.5px var(--sans);color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.card .mor{width:36px;height:4px;display:flex;gap:1px}
.card .mor i{flex:1;background:#3b2e22}
.card .mor i.on{background:var(--ok)}
.card .mor i.low{background:var(--brass)}
.card .st{font:10px/12px var(--sans);margin-left:auto;color:var(--cream);border:1px solid var(--line-hi);padding:0 3px;border-radius:2px;white-space:nowrap}
.sup{display:flex;gap:8px;margin-left:auto;font:11px var(--sans);font-variant-numeric:tabular-nums;color:var(--cream)}
.sup span{display:flex;align-items:center;gap:3px;white-space:nowrap}
.sup canvas{width:14px;height:14px}
.speed{display:flex;gap:3px}
.speed .ib{width:30px;font:700 11px var(--sans);color:var(--dim)}
.speed .ib.on{color:var(--walnut);background:var(--cream);border-color:var(--cream)}
/* ---------- bark: one line, under the strip, never over the field edge ---------- */
#bark{position:absolute;top:46px;left:50%;transform:translateX(-50%);max-width:520px;padding:5px 12px 6px;background:rgba(28,21,16,.82);
  border:1px solid var(--line);border-radius:3px;font:12px/1.35 var(--serif);white-space:nowrap;opacity:0;transition:opacity .4s}
#bark.on{opacity:1}
#bark b{font-weight:700;margin-right:6px}
#bark .who-b{color:var(--friend)}
#bark .who-r{color:#e8b07a}
/* ---------- ability: bottom-right thumb ---------- */
#abil{position:absolute;right:12px;bottom:10px;width:64px;height:64px;border-radius:50%;background:var(--panel2);border:1px solid var(--line-hi);
  display:grid;place-items:center;box-shadow:0 2px 0 rgba(0,0,0,.35),inset 0 1px 0 rgba(255,236,200,.1)}
#abil canvas.ring{position:absolute;inset:-4px;width:72px;height:72px}
#abil canvas.ico{width:28px;height:28px;margin-top:-8px}
#abil .lb{position:absolute;bottom:9px;font:700 10px var(--serif);color:var(--cream);white-space:nowrap}
#abil .cd{position:absolute;top:-16px;font:10px var(--sans);color:var(--dim);white-space:nowrap}
#abil.ready{border-color:var(--brass)}
#abil.ready .lb{color:var(--brass)}
/* ---------- objective tag (bottom-left, small, translucent) ---------- */
#obj{position:absolute;left:10px;bottom:10px;padding:4px 9px;font:11px/1.3 var(--serif);color:var(--cream);background:rgba(28,21,16,.66);border-left:2px solid var(--brass);border-radius:0 3px 3px 0}
#obj small{display:block;color:var(--dim);font:10px var(--sans)}
body.sheet #hud,body.uimode #hud{display:none}
/* ---------- ui mode (campaign march + briefing) ---------- */
#ui{position:absolute;inset:0;display:none}
body.uimode #ui{display:block}
#brief{position:absolute;right:0;top:0;bottom:0;width:322px;background:rgba(30,23,18,.95);border-left:1px solid var(--line);padding:12px 16px 12px 16px;
  box-shadow:-6px 0 18px rgba(0,0,0,.35)}
#brief .kick{font:10.5px var(--sans);color:var(--dim);letter-spacing:.08em}
#brief h1{margin:2px 0 1px;font:700 21px/1.2 var(--serif);letter-spacing:.01em}
#brief .sub{font:11.5px var(--sans);color:var(--dim)}
#brief .quote{margin:9px 0 8px;padding:7px 10px;border-left:2px solid var(--friend-d);background:rgba(255,236,200,.04);font:12.5px/1.5 var(--serif)}
#brief .quote b{display:block;font:700 10.5px var(--sans);color:var(--friend);margin-bottom:2px}
#brief dl{display:grid;grid-template-columns:52px 1fr;gap:4px 8px;margin:0 0 8px;font:11.5px/1.35 var(--sans)}
#brief dt{color:var(--mute)}
#brief dd{margin:0;color:var(--cream)}
#brief dd em{font-style:normal;color:var(--dim)}
#brief .row{display:flex;gap:6px;align-items:center;margin:2px 0 0}
#brief .row canvas{width:20px;height:26px}
#brief .go{position:absolute;left:16px;right:16px;bottom:12px;height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;
  background:var(--brass);color:#2a1c0c;border-radius:3px;font:700 15px var(--serif);box-shadow:inset 0 -2px 0 var(--brass-d),0 2px 0 rgba(0,0,0,.3)}
#brief .go small{font:11px var(--sans);font-weight:400}
#maphead{position:absolute;left:12px;top:10px;display:flex;align-items:center;gap:10px}
#maphead .t{font:700 15px var(--serif)}
#maphead .s{font:11px var(--sans);color:var(--dim)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="top">
    <div class="ib hit" title="전역 지도"><canvas data-ico="map" width="36" height="36"></canvas></div>
    <div class="wave"><canvas id="dial" width="60" height="44"></canvas>
      <div><div class="t1">둘째 물결<span class="pips"><i class="on"></i><i class="now"></i><i></i><i></i><i></i></span></div>
      <div class="t2">해 질 때까지 버텨라</div></div></div>
    <div class="keep"><div class="row"><canvas data-ico="folk" width="26" height="26"></canvas><span>피란민</span><span id="keepV" style="margin-left:auto;color:var(--cream)">148/212</span></div><div class="bar"><b id="keepB" style="width:70%"></b></div></div>
    <div class="sep"></div>
    <div class="card hit sel" id="card0"><canvas id="em0" width="40" height="52"></canvas><div><div class="nm">개울목 방패대</div><div class="meta"><span class="cnt" id="cnt0">10/10</span><span class="mor" id="mor0"></span><span class="st">고수</span></div></div></div>
    <div class="card hit" id="card1"><canvas id="em1" width="40" height="52"></canvas><div><div class="nm">버들골 창병대</div><div class="meta"><span class="cnt" id="cnt1">12/12</span><span class="mor" id="mor1"></span><span class="st">뒷줄</span></div></div></div>
    <div class="sup"><span><canvas data-ico="arrows" width="28" height="28"></canvas><b id="supA">1,840</b></span><span><canvas data-ico="bread" width="28" height="28"></canvas>96</span><span><canvas data-ico="herb" width="28" height="28"></canvas>14</span></div>
    <div class="speed"><div class="ib hit"><canvas data-ico="pause" width="36" height="36"></canvas></div><div class="ib hit on">1×</div></div>
  </div>
  <div id="bark"></div>
  <div id="abil" class="hit ready"><canvas class="ring" width="144" height="144"></canvas><canvas class="ico" data-ico="oil" width="56" height="56"></canvas><span class="lb">끓는 기름</span></div>
</div>
<div id="ui"></div>
<script>

// ---- core.js ----
'use strict';
// ============================================================================
// 잿빛 성벽 — "축경(縮景)" direction prototype. Everything is drawn by code.
// core: params, RNG, noise, world constants, camera
// ============================================================================
const Q = new URLSearchParams(location.search);
const P_T = Math.max(0, parseFloat(Q.get('t') || '0'));
const P_ZOOM = parseFloat(Q.get('zoom') || '0');
const P_SHEET = Q.get('sheet') === '1';
const P_UI = Q.get('ui') === '1';
const P_N = Math.max(30, Math.min(800, parseInt(Q.get('n') || '100', 10)));
const P_SEED = parseInt(Q.get('seed') || '11', 10);
const P_HUD = Q.get('hud') !== '0';
const P_PERF = Q.get('perf') === '1';
const P_LOW = Q.get('tier') === 'low';
const DPR = Math.min(window.devicePixelRatio || 1, P_LOW ? 1.25 : 2);

// ---------- deterministic RNG (mulberry32) ----------
function RNG(seed) {
  let a = seed >>> 0;
  const f = () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  f.range = (lo, hi) => lo + (hi - lo) * f();
  f.int = (lo, hi) => Math.floor(lo + (hi - lo + 1) * f());
  f.pick = (arr) => arr[Math.floor(f() * arr.length)];
  f.chance = (p) => f() < p;
  return f;
}

// ---------- value noise (hash based, no tables) ----------
function hash2(x, y, s) {
  let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(s, 1442695041)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y, s) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi, s), b = hash2(xi + 1, yi, s), c = hash2(xi, yi + 1, s), d = hash2(xi + 1, yi + 1, s);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, s) {
  return vnoise(x, y, s) * 0.5 + vnoise(x * 2.03, y * 2.03, s + 1) * 0.25 + vnoise(x * 4.1, y * 4.1, s + 2) * 0.15 + vnoise(x * 8.3, y * 8.3, s + 3) * 0.1;
}
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

// ---------- colour helpers ----------
function hex(c) { const n = parseInt(c.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function rgb(r, g, b, a) { return a === undefined ? `rgb(${r | 0},${g | 0},${b | 0})` : `rgba(${r | 0},${g | 0},${b | 0},${a})`; }
function shade(c, k) { const [r, g, b] = hex(c); return k >= 0 ? rgb(r + (255 - r) * k, g + (255 - g) * k, b + (255 - b) * k) : rgb(r * (1 + k), g * (1 + k), b * (1 + k)); }
function mix(c1, c2, t) { const a = hex(c1), b = hex(c2); return rgb(lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)); }
function mixA(a, b, t) { return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]; }

function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }

// ---------- world layout (world px, 16 px = 1 sim tile) ----------
// 3/4 projection: screen = (x, y*KY - z). KY<1 tilts the table toward the camera.
const WW = 880, WH = 520, KY = 0.8;
const WY0 = 196, WY1 = 216, WZ = 36;            // curtain wall: back line, front line, height
const GATE_X = 440;
const TWL = { x0: 334, x1: 390 }, TWR = { x0: 490, x1: 546 }; // twin gate towers (x span)
const TW_F = WY1 + 24, TW_B = WY0 - 4, TZ = 60;
const GH_F = WY1 + 3, GHZ = WZ + 8;              // gatehouse face line and height
const BAR_Y = WY1 + 34;                           // barricade line in front of the broken gate
const RTOW = [{ cx: 62, cy: WY1 - 8, r: 30, z: 54 }, { cx: 818, cy: WY1 - 8, r: 30, z: 54 }];
const WALK_Y = WY0 + 14;                          // where wall-walk soldiers stand (near parapet)

// ---------- camera ----------
const CAM = { zoom: 1, x: 0, sy: 0, PX: 1, W: 0, H: 0, cssW: 844, cssH: 390, shakeX: 0, shakeY: 0 };
function setupCamera(cssW, cssH) {
  CAM.cssW = cssW; CAM.cssH = cssH;
  if (P_ZOOM > 0) {
    CAM.zoom = P_ZOOM;
    const vw = cssW / CAM.zoom, vh = cssH / CAM.zoom;
    CAM.x = GATE_X - 30 - vw / 2;
    CAM.sy = (BAR_Y) * KY - 22 - vh / 2;
  } else {
    CAM.zoom = cssW / WW;
    CAM.x = 0;
    CAM.sy = 2;
  }
  CAM.PX = CAM.zoom * DPR;
  CAM.W = Math.round(cssW * DPR); CAM.H = Math.round(cssH * DPR);
}
// world -> device px
const SX = (x) => (x - CAM.x) * CAM.PX;
const SY = (y, z) => (y * KY - (z || 0) - CAM.sy) * CAM.PX;

// ---- sprites.js ----
// ============================================================================
// sprites: a tiny 3D rig per body plan, projected to 3 facings (+1 mirrored),
// baked at boot into one atlas page per unit kind. Dye = palette parameter.
// ============================================================================
const OUTLINE = '#24180f';
const PALS = {
  // Haldmere March (defenders): cool steel-blue + cream, light values
  realm: { cloth: '#2c5d93', clothD: '#1c3c63', trim: '#efe2bf', sleeve: '#9aa3ad', hose: '#353a46', boot: '#4a3222', metal: '#c9cfd5', metalD: '#7b838c', skin: '#e2b58c', hair: '#5a3a24', wood: '#8a5e36', leather: '#6b4a2e', emb: '#efe2bf' },
  realmA: { cloth: '#e4d5ae', clothD: '#b8a57a', trim: '#2c5d93', sleeve: '#d6c69e', hose: '#353a46', boot: '#4a3222', metal: '#c9cfd5', metalD: '#7b838c', skin: '#e2b58c', hair: '#5a3a24', wood: '#8a5e36', leather: '#6b4a2e', hood: '#2c5d93', emb: '#2c5d93' },
  // Aurel Concord (humans): crimson + ivory, mid values
  aurel: { cloth: '#a12f2b', clothD: '#641b1c', trim: '#e6d6b0', sleeve: '#878b92', hose: '#4a3426', boot: '#33241a', metal: '#b4b8bd', metalD: '#6a6f76', skin: '#d8a47c', hair: '#3a2618', wood: '#7a5230', leather: '#5a3a22', emb: '#e6d6b0' },
  aurelL: { cloth: '#8c4334', clothD: '#5c2b21', trim: '#d9c9a3', sleeve: '#8c4334', hose: '#5a4a3a', boot: '#33241a', metal: '#a9adb2', metalD: '#6a6f76', skin: '#d29d74', hair: '#3a2618', wood: '#7a5230', leather: '#5a3a22', cap: '#d9c9a3', emb: '#d9c9a3' },
  aurelB: { cloth: '#a12f2b', clothD: '#641b1c', trim: '#e6d6b0', sleeve: '#6e5638', hose: '#4a3426', boot: '#33241a', metal: '#b4b8bd', metalD: '#6a6f76', skin: '#d8a47c', hair: '#3a2618', wood: '#7a5230', leather: '#5a3a22', hat: '#5b4630', emb: '#e6d6b0' },
  // Ashtusk Horde (orcs, goblins): lichen green skin, dark leather, bone, rust paint, dark values
  orc: { cloth: '#7b3a22', clothD: '#4f2519', trim: '#ddd2b0', sleeve: '#7d9152', hose: '#47301f', boot: '#2b1e16', metal: '#8f8d86', metalD: '#55534e', skin: '#7d9152', skinD: '#566937', hair: '#231b16', wood: '#6e4b2c', leather: '#47301f', paint: '#b8392a', emb: '#b8392a' },
  orc2: { cloth: '#5d4a36', clothD: '#3d3024', trim: '#ddd2b0', sleeve: '#7d9152', hose: '#47301f', boot: '#2b1e16', metal: '#8f8d86', metalD: '#55534e', skin: '#748a4b', skinD: '#506232', hair: '#231b16', wood: '#6e4b2c', leather: '#47301f', paint: '#b8392a', emb: '#b8392a' },
  orcB: { cloth: '#8a201b', clothD: '#5a1512', trim: '#ddd2b0', sleeve: '#4f5056', hose: '#2f2a26', boot: '#201812', metal: '#55565c', metalD: '#2f3034', skin: '#6a7d44', skinD: '#4a5a2c', hair: '#1a1410', wood: '#5a3a22', leather: '#3a2618', paint: '#c23a28', emb: '#ddd2b0' },
  gob: { cloth: '#5e3f26', clothD: '#3f2a19', trim: '#a08a5a', sleeve: '#5e3f26', hose: '#3f2a19', boot: '#2b1e16', metal: '#9a978e', metalD: '#5a5853', skin: '#a9a84a', skinD: '#7b7a30', hair: '#2a2016', wood: '#6e4b2c', leather: '#47301f', hood: '#4d3420', emb: '#a08a5a' },
  // villagers (render-only life): muted, never steel-blue
  vW: { cloth: '#8b6a3c', clothD: '#5e4626', trim: '#e7dcc0', sleeve: '#d9cba8', hose: '#5e4626', boot: '#3a2a1c', skin: '#e0b28a', hair: '#4a2f1d', scarf: '#9c5a5a', wood: '#7a5230', leather: '#5a3a22', emb: '#e7dcc0' },
  vM: { cloth: '#6b7553', clothD: '#495037', trim: '#c9b98f', sleeve: '#6b7553', hose: '#5a4632', boot: '#3a2a1c', skin: '#d29d74', hair: '#6a6258', wood: '#7a5230', leather: '#5a3a22', emb: '#c9b98f' },
  vC: { cloth: '#a8693f', clothD: '#73482b', trim: '#e7dcc0', sleeve: '#a8693f', hose: '#5e4626', boot: '#3a2a1c', skin: '#e6b892', hair: '#7a4a24', wood: '#7a5230', leather: '#5a3a22', emb: '#e7dcc0' },
};
const BODY = {
  human: { hip: 4.3, su: 8.5, sh: 2.35, hw: 1.15, hr: 2.1, hu: 10.75, td: 1.3, leg: 1.85, arm: 1.55, hunch: 0, sc: 1 },
  orc: { hip: 4.0, su: 8.7, sh: 3.15, hw: 1.5, hr: 2.2, hu: 10.35, td: 1.8, leg: 2.25, arm: 2.05, hunch: 0.9, sc: 1.04 },
  orcbig: { hip: 4.0, su: 8.7, sh: 3.25, hw: 1.55, hr: 2.25, hu: 10.4, td: 1.9, leg: 2.3, arm: 2.15, hunch: 0.8, sc: 1.2 },
  goblin: { hip: 2.6, su: 5.7, sh: 1.75, hw: 0.95, hr: 2.3, hu: 8.0, td: 1.1, leg: 1.45, arm: 1.2, hunch: 0.5, sc: 1 },
  child: { hip: 2.9, su: 5.8, sh: 1.6, hw: 0.9, hr: 1.95, hu: 7.7, td: 1.0, leg: 1.4, arm: 1.15, hunch: 0, sc: 1 },
};
// unit kinds (stats used by the prototype sim; names match src/sim/defs.ts where they exist)
const KINDS = {

  d_sword: { nm: '방패검병', fac: '할드미어 변경군', pal: 'realm', body: 'human', helm: 'kettle', wc: 'sword', sh: 'heater', side: 0, hp: 130, atk: 11, cd: 1.0, spd: 25, reach: 13 },

// ---------- vector helpers ----------
const V = {

// ---------- poses ----------
function poseFor(kd, B, anim, i) {

  } else if (anim === 'die') {
    P.lean = -0.5; P.bob = -0.8;

    P.fl = [-B.hw - 0.4, 0, 0.6]; P.fr = [B.hw + 0.5, 0, -0.2];

// ---------- the figure painter ----------
function paintFigure(g, kd, anim, i, f) {

      if (kd.pal === 'orc2') { g.fillStyle = '#6b5a44'; g.beginPath(); g.ellipse((q[0][0] + q[1][0]) / 2, (q[0][1] + q[1][1]) / 2 + 0.3, Math.abs(q[1][0] - q[0][0]) / 2 + 0.7, 1.1, 0, 0, 6.28); g.fill(); }

function flagPath(g, shape, w, h, wave, ph) {

  for (const p of pts) g.lineTo(p[0], p[1]);

  if (shape === 'swallow') { g.lineTo(last[0] + Math.sin(ph) * wave * 0.3, h); g.lineTo(w * 0.5 + Math.sin(ph + 2) * wave * 0.6, h * 0.72 + Math.sin(ph + 2) * wave * 0.3); g.lineTo(Math.sin(ph + 1) * wave * 0.3, h); }
  else { for (let k = N; k >= 0; k--) { const t = k / N; g.lineTo(t * w + Math.sin(ph + t * 3 + 0.6) * wave * 0.5, h + Math.sin(ph + t * 4.2 + 0.4) * wave * t); } }

}

  else if (emb === 'leaf') { g.beginPath(); g.moveTo(cx, cy - 3.6 * s); g.quadraticCurveTo(cx + 2.4 * s, cy - 0.5 * s, cx, cy + 3.2 * s); g.quadraticCurveTo(cx - 2.4 * s, cy - 0.5 * s, cx, cy - 3.6 * s); g.fill(); g.strokeStyle = g.fillStyle === col ? 'rgba(255,255,255,0.0)' : col; }
  else if (emb === 'bell') { g.beginPath(); g.moveTo(cx - 2.6 * s, cy + 2 * s); g.quadraticCurveTo(cx - 2.2 * s, cy - 3 * s, cx, cy - 3 * s); g.quadraticCurveTo(cx + 2.2 * s, cy - 3 * s, cx + 2.6 * s, cy + 2 * s); g.closePath(); g.fill(); g.beginPath(); g.arc(cx, cy + 2.7 * s, 0.8 * s, 0, 6.28); g.fill(); }

  else if (emb === 'tusk') { g.lineWidth = 1.0 * s; for (const sd of [-1, 1]) { g.beginPath(); g.moveTo(cx + sd * 2.4 * s, cy + 3 * s); g.quadraticCurveTo(cx + sd * 3.2 * s, cy - 1 * s, cx + sd * 0.6 * s, cy - 3.4 * s); g.stroke(); } }
  else if (emb === 'sun') { g.lineWidth = 0.6 * s; g.beginPath(); g.arc(cx, cy, 2.2 * s, 0, 6.28); g.stroke(); g.beginPath(); g.moveTo(cx, cy - 2.2 * s); g.lineTo(cx, cy + 2.2 * s); g.moveTo(cx - 2.2 * s, cy); g.lineTo(cx + 2.2 * s, cy); g.stroke(); }

// ============================================================================
// sim: deterministic fixed-step battle (1/30 s, seeded RNG). It never reads
// anything the renderer owns; the renderer only drains sim.fx.
// Scenario: 쌍둥이탑 성, second wave. The south gate was smashed in the first
// wave and is held behind a cart barricade. Aurel Concord ladders + a siege
// tower on the curtain, Ashtusk orcs and goblins on the gate.
// ============================================================================
const DT = 1 / 30;
function Sim(seed, n) {
  const S = this;

  S.bar = { hp: 240, max: 240, broken: false };
  S.keep = 100;
  S.oilT = 8.6; S.oilDone = false; S.burn = []; // burning oil patches
  const m = n / 100;
  S.m = m;
  const R = S.rng;
  const add = (k, x, y, z, role, extra) => {
    const kd = KINDS[k];
    const u = { id: S.nextId++, k, kd, side: kd.side, x, y, z: z || 0, px: x, py: y, hp: kd.hp, cd: R() * kd.cd, st: 'idle', role, tgt: null, fx: 0, fy: kd.side ? -1 : 1, hitT: 0, gx: x, gy: y, lad: null, climbT: 0, sq: -1, ...extra };
    S.units.push(u); return u;
  };
  S.add = add;
  // ---- defenders ----
  const nArch = Math.round(18 * m), nSw = Math.round(10 * m), nSp = Math.round(12 * m);
  const posts = [];
  const lc = Math.ceil(nArch * 0.34), rc = Math.ceil(nArch * 0.34), tw = Math.max(2, nArch - lc - rc);
  for (let i = 0; i < lc; i++) posts.push([112 + (i + 0.5) * (214 / lc), WALK_Y + (i % 2) * 2, WZ, 2]);
  for (let i = 0; i < rc; i++) posts.push([556 + (i + 0.5) * (226 / rc), WALK_Y + (i % 2) * 2, WZ, 3]);
  for (let i = 0; i < tw; i++) { const T = i % 2 ? TWR : TWL; const j = Math.floor(i / 2), per = Math.ceil(tw / 2); posts.push([T.x0 + 9 + ((j % 4) + 0.5) * ((T.x1 - T.x0 - 18) / Math.min(4, per)), TW_F - 7 - Math.floor(j / 4) * 9, TZ, i % 2 ? 3 : 2]); }
  for (const p of posts) add('d_archer', p[0] + (R() - 0.5) * 3, p[1], p[2], 'wall', { sq: p[3], post: [p[0], p[1]] });
  const ranks = (count, y0, dy, k, role, sq) => {
    const perRow = Math.min(count, k === 'd_sword' ? 10 : 12); let i = 0;
    for (let r = 0; i < count; r++) for (let c = 0; c < perRow && i < count; c++, i++) {
      const x = 397 + (c + 0.5) * (86 / perRow) + (r % 2) * 3;
      const y = y0 - r * dy;
      add(k, x, y, 0, role, { sq, slot: [x, y], rank: r });
    }
  };
  ranks(nSw, BAR_Y - 8, 7, 'd_sword', 'front', 0);
  ranks(nSp, BAR_Y - 19, 6, 'd_spear', 'back', 1);
  // ---- ladders & siege tower ----
  S.ladders = [
    { x: 214, foot: WY1 + 13, up: false, t: 0, need: 1, cool: 0, fallen: 0, climbers: 0 },
    { x: 596, foot: WY1 + 13, up: false, t: 0, need: 1, cool: 0, fallen: 0, climbers: 0 },
    { x: 300, foot: WY1 + 13, up: false, t: 0, need: 1, cool: 0, fallen: 0, climbers: 0 },
  ];
  S.tower = { x: 664, y: 382, hp: 950, docked: false, dockT: 0, bridge: 0, boarded: 0, vy: 9.2, burn: 0 };
  // ---- the opening forces (already in the field at t=0) ----
  S.cap = n;
  const grp = (k, cnt, x0, x1, y0, y1, role, extra) => { for (let i = 0; i < Math.round(cnt * m); i++) { if (S.t > 0 && S.units.length >= S.cap) break; add(k, R.range(x0, x1), R.range(y0, y1), 0, role, extra ? (typeof extra === 'function' ? extra(i) : extra) : {}); } };
  grp('o_grunt', 8, 380, 500, 300, 360, 'gate');
  grp('o_goblin', 10, 360, 520, 290, 380, 'gate');
  grp('h_ladder', 2, 200, 230, 286, 300, 'carry', { lad: 0 });
  grp('h_levy', 5, 186, 246, 300, 340, 'climb', { lad: 0 });
  grp('h_bow', 8, 120, 340, 400, 430, 'bow');
  grp('h_levy', 5, 640, 690, 404, 416, 'push');
  grp('h_maa', 6, 630, 700, 414, 440, 'board');
  S.sched = [
    { t: 2.5, f: () => { grp('h_ladder', 2, 584, 612, WH + 4, WH + 14, 'carry', { lad: 1 }); grp('h_levy', 4, 570, 630, WH + 6, WH + 30, 'climb', { lad: 1 }); grp('h_maa', 2, 570, 630, WH + 20, WH + 40, 'climb', { lad: 1 }); } },
    { t: 4.5, f: () => grp('o_jav', 5, 400, 500, WH + 4, WH + 30, 'jav') },
    { t: 6.5, f: () => { grp('h_ladder', 2, 288, 314, WH, WH + 10, 'carry', { lad: 2 }); grp('h_levy', 5, 270, 330, WH + 6, WH + 36, 'climb', { lad: 2 }); } },
    { t: 7.5, f: () => { add('o_boss', 448, 452, 0, 'boss'); S.events.push({ t: S.t, k: 'boss' }); grp('o_grunt', 6, 410, 490, WH + 10, WH + 40, 'gate'); grp('o_goblin', 8, 380, 520, WH + 10, WH + 50, 'gate'); } },
    { t: 11.5, f: () => { grp('o_goblin', 10, 360, 540, WH + 4, WH + 40, 'gate'); grp('o_grunt', 4, 400, 480, WH + 10, WH + 40, 'gate'); } },
    { t: 14.5, f: () => { grp('h_maa', 6, 190, 320, WH + 4, WH + 30, 'climb', (i) => ({ lad: i % 2 ? 2 : 0 })); grp('h_bow', 4, 140, 300, WH + 4, WH + 20, 'bow'); } },
    { t: 18.0, f: () => { grp('o_grunt', 6, 400, 500, WH + 4, WH + 30, 'gate'); grp('o_goblin', 8, 360, 540, WH + 4, WH + 40, 'gate'); } },
  ];

    for (let i = 0; i < extra; i++) { const k = R.pick(['o_grunt', 'o_goblin', 'h_levy', 'h_maa', 'o_goblin']); add(k, R.range(240, 640), R.range(300, 500), 0, k.startsWith('h') ? 'climb' : 'gate', k.startsWith('h') ? { lad: R.int(0, 2) } : {}); }
  }
}

    [12, [214, 208, 214], 1.6, 0.2, 0.3],

  const ui = document.getElementById('ui');
  ui.innerHTML = `
  <div id="maphead"><div class="ib hit"><canvas data-ico="map" width="36" height="36"></canvas></div><div><div class="t">변경 행군도</div><div class="s">가을걷이에서 첫서리로 · 병력 212 · 뒤따르는 피란민 1,140</div></div></div>
  <div id="brief">
    <div class="kick">제6장 · 첫서리 내린 저녁</div>

    <div class="quote"><b>보른, 개울목 방패대</b>탑 하나는 우리 할아비들이 쌓았고, 하나는 놈들이 무너뜨렸지. 이번엔 둘 다 지킨다.</div>
    <dl>
      <dt>적</dt><dd><span class="sig"><canvas id="sg0" width="28" height="36"></canvas>아우렐 협약군</span><span class="sig"><canvas id="sg1" width="28" height="36"></canvas>애쉬터스크 군단</span></dd>
      <dt>때·날씨</dt><dd>해 질 녘, 강안개 <em>— 밤에는 비</em></dd>
      <dt>목표</dt><dd>해 질 때까지 세 성문 사수 <em>· 피란민 300 입성</em></dd>
      <dt>지난 일</dt><dd>은빛숲에서 활시위가 끊겼다 <em>· 화살 −20%</em></dd>
    </dl>
    <div class="sq">${SQUADS.map((q, i) => `<span><canvas id="bq${i}" width="40" height="52"></canvas><i>${[10, 12, 18, 4][i]}</i>${i === 0 ? '<b>노련</b>' : ''}${i === 3 ? '<b class="w">지침</b>' : ''}</span>`).join('')}</div>
    <div class="pick"><div class="ph">출정 전 결정 <em>— 하멜의 장부에 남는다</em></div><div class="ch on"><b>피란민 먼저</b>북문을 늦게 닫는다 · 성 안 접전</div><div class="ch"><b>성문 먼저</b>지금 닫는다 · 60명이 밖에 남는다</div></div>
    <div class="go hit">출정<small>세 성문 · 약 9분</small></div>
  </div>`;
  const st = document.createElement('style');
  st.textContent = `#brief .sig{display:inline-flex;align-items:center;gap:3px;margin-right:8px;white-space:nowrap}#brief .sig canvas{width:11px;height:14px}

  #brief .pick{margin-top:8px}#brief .ph{font:700 11px var(--serif);color:var(--cream);margin-bottom:4px}#brief .ph em{font:400 10px var(--sans);color:var(--mute);font-style:normal}
  #brief .go{height:36px;bottom:10px}#brief .ch{white-space:nowrap;font:10.5px/1.35 var(--sans);color:var(--dim);border:1px solid var(--line);border-radius:3px;padding:4px 7px;margin-bottom:4px;background:rgba(255,236,200,.03)}#brief .ch b{color:var(--cream);margin-right:6px;font-family:var(--serif)}#brief .ch.on{border-color:var(--brass);box-shadow:inset 2px 0 0 var(--brass)}

// entry
// ============================================================================
window.addEventListener('load', () => {
  try {
    if (P_SHEET) { document.body.classList.add('sheet'); runSheet(); return; }
    if (P_UI) { document.body.classList.add('uimode'); runUI(); return; }
    runBattle();
  } catch (e) {
    console.error(e);
    document.body.insertAdjacentHTML('beforeend', `<pre style="position:fixed;left:8px;bottom:8px;color:#f88;font:11px monospace;z-index:9">${String(e.stack || e)}</pre>`);
    window.__ready = true; window.__error = String(e.stack || e);
  }
});

</script>
